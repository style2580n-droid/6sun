<script>
/* window.storage 폴리필 — 일반 웹(GitHub Pages 등)에서는 localStorage로 영구 저장 */
(function(){
  if (window.storage) return;
  function lsKey(k, shared){ return (shared?"shared:":"user:") + k; }
  window.storage = {
    async get(key, shared){
      const v = localStorage.getItem(lsKey(key, shared));
      if (v === null) return null;
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem(lsKey(key, shared), value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      localStorage.removeItem(lsKey(key, shared));
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      const pfx = lsKey(prefix||"", shared);
      const keys = [];
      for (let i=0;i<localStorage.length;i++){
        const full = localStorage.key(i);
        if (full && full.startsWith(pfx)){
          keys.push(full.replace(shared?"shared:":"user:",""));
        }
      }
      return { keys, prefix, shared: !!shared };
    }
  };
})();
</script>

let _pipelineFetchPromise = null;
function fetchPipelineDataMultileague() {
  // 여러 리그를 빠르게 전환해도 fetch가 중복으로 나가지 않도록 Promise를 캐시한다.
  if (_pipelineFetchPromise) return _pipelineFetchPromise;
  _pipelineFetchPromise = (async () => {
    try {
      const url = `https://raw.githubusercontent.com/${PIPELINE_REPO_OWNER}/${PIPELINE_REPO_NAME}/${PIPELINE_BRANCH}/reports/app_data_multileague.js?t=${Date.now()}`;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) {
        console.warn("[pipeline] app_data_multileague.js 없음:", res.status);
        return false;
      }
      const text = await res.text();
      // 파일 내용이 이미 "window.PIPELINE_DATA_LALIGA = {...};" 형태의 실행 가능한
      // JS 문이라, EPL 앱처럼 구조분해할 필요 없이 그대로 실행만 하면 window에 붙는다.
      new Function(text)();
      return true;
    } catch (e) {
      console.warn("[pipeline] fetch 실패:", e);
      return false;
    }
  })();
  return _pipelineFetchPromise;
}

let SQUADS = {};     // { 팀명: [선수명, ...] } — app_export_multileague.py의 squads 필드

// ── 부상자/월드컵 피로도 (2026-07-15 추가, 데이터는 아직 파이프라인에서 안 옴 — 틀만 미리 준비) ──
// TEAM_INJURIES: EPL 앱의 SQUADS[team].keyOut/injured와 동일한 필드명·의미.
//   { 팀명: { keyOut: [선수명,...], injured: [선수명,...] } }
//   keyOut = 핵심 결장(주전급 장기이탈), injured = 로테이션 부상(경미)
// TEAM_FATIGUE: 월드컵 여독 — { 팀명: { fatigueScore: 0~1 } }. EPL 앱에도 fatigue 필드가
//   ELO 객체 안에 있지만 실제로 어디서도 안 쓰이고 있었음(빈 자리로만 존재) — 여기서는
//   실제로 computeLambdas에 연결해뒀다. 값이 없으면(신규 데이터 도착 전) 항상 무효과.
let TEAM_INJURIES = {};
let TEAM_FATIGUE = {};

// injuryLambdaAdjust: EPL 앱과 동일 공식 — keyOut 1명당 -6%, injured 1명당 -2%, 하한 -28%
function injuryLambdaAdjust(home, away) {
  function penalty(team) {
    const inj = TEAM_INJURIES[team];
    if (!inj) return 1;
    const keyOut = Array.isArray(inj.keyOut) ? inj.keyOut.length : 0;
    const injured = Array.isArray(inj.injured) ? inj.injured.length : 0;
    return Math.max(0.72, 1 - keyOut * 0.06 - injured * 0.02);
  }
  return { homeFactor: penalty(home), awayFactor: penalty(away) };
}

// fatigueLambdaAdjust: 월드컵 결승까지 많이 뛴 선수가 있는 팀은 시즌 초반 소폭 페널티.
// fatigueScore는 0(영향없음)~1(최대 피로) 범위로 파이프라인이 계산해서 줄 예정 — 최대 -10%.
function fatigueLambdaAdjust(team) {
  const f = TEAM_FATIGUE[team];
  const score = f && Number.isFinite(f.fatigueScore) ? Math.max(0, Math.min(1, f.fatigueScore)) : 0;
  return Math.max(0.90, 1 - score * 0.10);
}

let TEAM_XG = {};    // { 팀명: { xG, xGA } } — collect_xg_bsd.py의 teamXg 필드
                      // (24-25/25-26 시즌 평균, 26-27 신규 승격팀은 항목이 없을 수 있음 — 정상)

// ── 선수 능력치 기준선 (A단계, 2026-07-22 연결) ──────────────────────────────
// PLAYER_BASELINE: player_baseline.json(update_player_baseline()) 구조 그대로.
//   { "이름|국가": { name_kr, club_en, league, position, per90:{scoring,creating,defending}, source, league_apps, ... } }
// source는 두 가지: "wc2026"(월드컵 기록으로 채운 시즌 초 임시값) / "league"(실제 26-27 리그 경기로
// 갱신된 값, league_apps>=5일 때 자동 전환 — 인수인계 7번 항목).
//
// ⚠️ 지금 시점(개막 전) 매칭 가능한 선수는 club_en이 채워진 314명 중 6개 리그 소속만이고
// (팀당 평균 2명 안팎), 그마저 전부 source=wc2026(월드컵 기록)이라 팀 단위로 평균 내기엔
// 표본이 너무 적고 왜곡 위험이 크다 — "추측 금지" 원칙에 따라 이 값들로는 예측을 흔들지 않는다.
// 그래서 playerLambdaAdjust는 source==="league"(=실제 시즌 데이터로 갱신된 선수)만 세고,
// 팀당 최소 표본(PLAYER_MIN_SAMPLE)을 못 채우면 항상 무효과(factor=1)를 반환한다.
// 개막 후 몇 주 지나 league_apps>=5인 선수가 팀당 쌓이면 자동으로 활성화된다(별도 배포 불필요).
let PLAYER_BASELINE = {};
const PLAYER_MIN_SAMPLE = 4; // 팀당 이 명수 이상 source=league 선수가 있어야 반영 시작

// teamMatchedLeaguePlayers: club_en 기준으로 이 팀 소속이면서 source=league인 선수만 추출.
function teamMatchedLeaguePlayers(leagueKey, teamName) {
  const clubEn = (ENGLISH_NAME[leagueKey] && ENGLISH_NAME[leagueKey][teamName]) || null;
  if (!clubEn) return [];
  return Object.values(PLAYER_BASELINE).filter(p =>
    p && p.club_en === clubEn && p.source === "league" &&
    p.per90 && Number.isFinite(p.per90.scoring) && Number.isFinite(p.per90.creating));
}

// leagueAvgPer90: 매칭된(source=league) 선수 전체 기준 리그 평균 scoring+creating per90.
// 팀 지수를 이 평균 대비 상대값으로 계산해야 리그마다 득점 수준이 달라도 공정하게 비교된다.
function leagueAvgPer90(leagueKey) {
  const teams = LEAGUES[leagueKey].teams;
  let sum = 0, n = 0;
  teams.forEach(t => {
    teamMatchedLeaguePlayers(leagueKey, t).forEach(p => {
      sum += p.per90.scoring + p.per90.creating;
      n++;
    });
  });
  return n > 0 ? sum / n : null;
}

// playerLambdaAdjust: 팀별 매칭 선수의 (scoring+creating) per90 평균이 리그 평균보다 높으면
// 공격 λ를 소폭 상향, 낮으면 소폭 하향. 표본 부족 시 항상 1(무효과) — xG/부상/피로도와 동일한
// "안전한 폴백" 패턴. 효과는 최대 ±8%로 제한(팀 단위 ELO/xG보다 신뢰도가 낮은 보조 신호이므로).
function playerLambdaAdjust(leagueKey, teamName) {
  const matched = teamMatchedLeaguePlayers(leagueKey, teamName);
  if (matched.length < PLAYER_MIN_SAMPLE) return { factor: 1, applied: false, matched: matched.length };
  const avgLeague = leagueAvgPer90(leagueKey);
  if (!Number.isFinite(avgLeague) || avgLeague <= 0) return { factor: 1, applied: false, matched: matched.length };
  const teamAvg = matched.reduce((s, p) => s + p.per90.scoring + p.per90.creating, 0) / matched.length;
  const rel = (teamAvg - avgLeague) / avgLeague; // -1 ~ +수 (통상 -0.5~+0.5권)
  const factor = Math.max(0.92, Math.min(1.08, 1 + rel * 0.16));
  return { factor, applied: true, matched: matched.length };
}

// TRANSFERS: EPL 앱의 TRANSFERS와 동일 구조 — { 팀명: { in:[{player,from,date}], out:[{player,to,date}] } }.
// collect_transfers_bsd.py는 예전부터 6개 리그 이적도 감지해서 쌓아뒀는데, app_export_multileague.py
// 출력에 안 붙어있어서 이 앱까지 못 왔었다 (2026-07-16 파이프라인 쪽에서 연결 완료).
let TRANSFERS = {};

// H2H: EPL 앱과 동일 구조 — { "팀A|||팀B"(가나다순): [{home,away,homeGoals,awayGoals,date}, ...] }
let H2H = {};

// ══════════════════════════════════════════════════════════════
// 2026-07-29 EPL 앱에서 이식: 개인기여도(playerImpactPct) 엔진 전체.
// TEAM_GROUP_GAMES는 PIPELINE_DATA_{LEAGUE}.teamGroupGames에서 채워짐
// (loadPipelineDataMultileague에서 배선 — 아래 참고). STAR_PLAYERS/
// BACKUP_SEED(GK 리더보드)는 EPL 전용이라 8개리그엔 없음 — 코드 안에서
// typeof 체크로 안전하게 방어됨(없으면 그냥 그 보정만 스킵, 에러 없음).
let TEAM_GROUP_GAMES = {};
// 개인 능력치 기반 결장 영향 시스템
// 각 선수의 조별리그 3경기 지표를 합산·가중해 "기여도 점수"를 매기고,
// 팀 내 비중(공격/수비 각각)으로 환산 → 결장 시 그 비중만큼 팀 λ를 차등 조정.
// (메시 결장 = 큰 하락, 벤치 자원 결장 = 미미)
// ══════════════════════════════════════════════════════════════

// 한 팀의 선수별 "경기 로그 배열"을 이름별로 모은다(합산하지 않음).
// 결과: { 선수명: { name, pos, games:[ {경기별 스탯}, ... ] } }
function aggregateTeamPlayers(team) {
  const src = (typeof TEAM_GROUP_GAMES !== "undefined") ? TEAM_GROUP_GAMES[team] : null;
  const perGame = []; // 각 원소 = 한 경기의 선수 배열
  if (src) {
    for (const label in src) if (Array.isArray(src[label]) && src[label].length) perGame.push(src[label]);
  }
  // TEAM_GROUP_GAMES에 없으면 STATIC_MATCH_STATS에서라도 찾는다(구 데이터 호환)
  if (!perGame.length) {
    for (const key in STATIC_MATCH_STATS) {
      const m = STATIC_MATCH_STATS[key]; if (!m) continue;
      const [h, a] = key.split("_");
      if (h === team) { const g = (m.homeGames && m.defaultGame) ? m.homeGames[m.defaultGame] : m.home; if (g && g.length) perGame.push(g); }
      if (a === team) { const g = (m.awayGames && m.defaultGame) ? m.awayGames[m.defaultGame] : m.away; if (g && g.length) perGame.push(g); }
    }
  }
  const num = v => (typeof v === "number" && !isNaN(v)) ? v : 0;
  const acc = {};
  for (const gameArr of perGame) {
    for (const p of gameArr) {
      if (!p || !p.name) continue;
      if (!acc[p.name]) acc[p.name] = { name: p.name, pos: p.pos || "MF", games: [] };
      if (p.pos) acc[p.name].pos = p.pos;
      acc[p.name].games.push({
        goals:num(p.goals), assists:num(p.assists), shots:num(p.shots), sot:num(p.sot),
        xg:num(p.xg), xa:num(p.xa), icp:num(p.icp), tackles:num(p.tackles), clr:num(p.clr),
      });
    }
  }
  return Object.values(acc);
}

// 한 경기 스탯 → 공격/수비 원점수(포지션 가중 전).
function gameRawScore(g) {
  const n = v => (typeof v === "number" && !isNaN(v)) ? v : 0; // 없는 지표 0 (하위호환)
  // ═══ 승부예측 우선 15개 지표 반영 ═══
  // ── 공격 기여 (atk) ──
  const atkRaw =
      n(g.goals)*4.0 + n(g.assists)*3.0
    + n(g.xg)*2.2                 // 1. xG
    + n(g.xa)*1.8                 // 2. xA
    + n(g.progPass)*0.20          // 3. Progressive Passes
    + n(g.progCarry)*0.25         // 4. Progressive Carries
    + n(g.sca)*0.35               // 5. SCA (슛 연결 행동)
    + n(g.gca)*1.2                // 6. GCA (득점 연결 행동)
    + n(g.bigChances)*1.0         // 8. Big Chances (창출)
    + n(g.keyPasses)*0.5          // 9. Key Passes
    + (n(g.takeOnPct)/100)*n(g.takeOns)*0.4  // 14. Take-on Success% × 시도
    + n(g.sot)*0.4 + n(g.shots)*0.15
    - n(g.turnovers)*0.25;        // 턴오버 감점
  // ── 수비 기여 (def) ──
  const defRaw =
      n(g.tacklesWon)*0.6         // 10. Tackles Won (성공 태클 우선)
    + n(g.tackles)*0.3            //     (총 태클은 보조)
    + n(g.interceptions)*0.55     // 11. Interceptions
    + n(g.recoveries)*0.20        // 12. Recoveries (볼 회수)
    + (n(g.aerialWinPct)/100)*0.8 // 13. Aerial Win% (0~100 → 0~0.8)
    + n(g.psxgGA)*1.5             // 7. PSxG-GA (GK 막은 기대실점)
    + n(g.icp)*0.5 + n(g.clr)*0.35
    + n(g.pressSucc)*0.10 + (n(g.pressSuccPct)/100)*1.5; // 압박(횟수/성공률)
  return { atk: atkRaw, def: defRaw };
}

// 선수의 공격/수비 기여도 = (경기당 평균) × (일관성).  [평균 × 일관성 반반]
// 일관성 = 1 - 변동계수(CV)를 0~1로 클램프. CV = 표준편차/평균.
//   · 매 경기 비슷 → CV↓ → 일관성↑
//   · 한 경기만 반짝 → CV↑ → 일관성↓
// 최종점수 = 평균 × (0.5 + 0.5×일관성)  → 평균과 꾸준함을 반반 반영.
// 교체/1경기 표본도 평균 그대로 살리되(꾸준하면 표시됨), 표본 1개는 일관성 판단 불가로 중립(0.7) 적용.
function consistency(vals) {
  const n = vals.length;
  if (n <= 1) return 0.7; // 표본 1개: 중립(과도하게 깎지 않음)
  const mean = vals.reduce((a,b)=>a+b,0)/n;
  if (mean <= 0) return 0.5;
  const varc = vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n;
  const cv = Math.sqrt(varc)/mean;         // 변동계수
  return Math.max(0, Math.min(1, 1 - cv/1.5)); // CV 1.5 이상이면 일관성 0
}
function playerContribScore(p) {
  const games = p.games && p.games.length ? p.games : [{atk:0,def:0}];
  const atkArr = games.map(g => gameRawScore(g).atk);
  const defArr = games.map(g => gameRawScore(g).def);
  const mean = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  const atkMean = mean(atkArr), defMean = mean(defArr);
  const atkScore = atkMean * (0.5 + 0.5*consistency(atkArr));
  const defScore = defMean * (0.5 + 0.5*consistency(defArr));
  // 포지션 가중
  const pos = (p.pos || "MF").toUpperCase();
  let atkW = 1, defW = 1;
  if (pos === "FW") { atkW = 1.15; defW = 0.5; }
  else if (pos === "MF") { atkW = 1.0; defW = 0.85; }
  else if (pos === "DF") { atkW = 0.75; defW = 1.2; }
  else if (pos === "GK") { atkW = 0.0; defW = 0.6; }
  return { atk: atkScore * atkW, def: defScore * defW };
}

// ── GK 능력치: 리더보드(선방·클린시트·출전)에서 팀별 주전 GK를 찾아 0~1 점수화 ──
// 클린시트 + 선방수 조합. 약팀 GK가 선방만 많아 과대평가되는 걸 막기 위해
// 클린시트율을 크게, 선방수를 보조로. (요청: 클린시트+선방 조합)
function getTeamGkRating(team) {
  try {
    const lb = (typeof BACKUP_SEED !== "undefined" && BACKUP_SEED.leaderboard && BACKUP_SEED.leaderboard.gk) ? BACKUP_SEED.leaderboard.gk : null;
    if (!lb) return null;
    // "이름|국가" 키에서 해당 팀 GK 중 출전수 최다(주전) 1명 선택
    let best = null;
    for (const key in lb) {
      const parts = key.split("|");
      if (parts[1] !== team) continue;
      const v = lb[key];
      if (!best || (v.apps||0) > (best.apps||0) || ((v.apps||0)===(best.apps||0) && (v.saves||0)>(best.saves||0))) {
        best = { name: parts[0], saves: v.saves||0, cs: v.cs||0, apps: v.apps||0 };
      }
    }
    if (!best || best.apps <= 0) return null;
    const csRate = best.cs / best.apps;              // 클린시트율 0~1
    const savesPerGame = best.saves / best.apps;     // 경기당 선방
    // 조합: 클린시트율 0.65 + 선방(경기당 5개=만점 가정) 0.35
    const rating = Math.max(0, Math.min(1, csRate*0.65 + Math.min(1, savesPerGame/5)*0.35));
    return { name: best.name, rating, csRate, savesPerGame, apps: best.apps };
  } catch(e) { return null; }
}

// 팀의 선수별 공격/수비 비중(팀 합 대비 0~1)을 매핑으로 반환.
// GK는 필드 스탯이 빈약하므로 리더보드 기반 GK 능력치를 수비 비중에 별도 주입.
// 결과: { 선수명: {atkShare, defShare, atk, def, pos, isGk} }
const __teamShareCache = {};
function getTeamShares(team) {
  if (__teamShareCache[team]) return __teamShareCache[team];
  const players = aggregateTeamPlayers(team);
  const gk = getTeamGkRating(team);
  let totAtk = 0, totDef = 0;
  const scored = players.map(p => {
    const s = playerContribScore(p);
    totAtk += s.atk; totDef += s.def;
    return { name: p.name, pos: p.pos, atk: s.atk, def: s.def };
  });
  const map = {};
  for (const s of scored) {
    map[s.name] = {
      pos: s.pos,
      atk: s.atk, def: s.def,
      atkShare: totAtk > 0 ? s.atk / totAtk : 0,
      defShare: totDef > 0 ? s.def / totDef : 0,
      isGk: (s.pos||"").toUpperCase()==="GK",
    };
  }
  // GK 능력치 주입: 명단에 해당 GK가 있으면 그 선수에, 없으면 명단의 GK 포지션 첫 선수에 반영
  if (gk) {
    let target = map[gk.name] ? gk.name : Object.keys(map).find(n => map[n].isGk);
    if (target) { map[target].gkRating = gk.rating; map[target].isGk = true; }
  }
  __teamShareCache[team] = map;
  return map;
}

// ── 선수 등급 판정 + 결장 시 승률 보정폭(가이드 기반 상한 캡) ──
// 가이드:
//   에이스 공격수 4~6% / 주전 GK 3~5% / 핵심 MF 2~4% / 핵심 CB 2~3% / 일반 주전 1~2% / 백업 0~1%
// 팀 내 비중(share)으로 팀 안에서의 상대적 중요도를 재고, 포지션별 상한 안에서 스케일.
function playerImpactPct(team, name) {
  const map = getTeamShares(team);
  const info = map[name];
  if (!info) return 0;
  const pos = (info.pos || "MF").toUpperCase();
  const atkS = info.atkShare || 0;
  const defS = info.defShare || 0;

  // GK: 리더보드 능력치(0~1)로 3~5% 범위 스케일. 데이터 없으면 주전 GK 기본 3.5%.
  if (pos === "GK") {
    const r = (typeof info.gkRating === "number") ? info.gkRating : 0.5;
    return 3 + r * 2; // 3~5%
  }

  // 필드 플레이어: 공격 비중과 수비 비중 중 큰 역할을 기준으로 등급 상한 설정
  let cap, base, share;
  if (pos === "FW") {            // 공격수: 공격 비중 기준, 상한 6%
    share = atkS; cap = 6; base = 1;
  } else if (pos === "MF") {     // 미드필더: 공격+수비 혼합, 상한 4%
    share = atkS*0.6 + defS*0.4; cap = 4; base = 1;
  } else if (pos === "DF") {     // 수비수: 수비 비중 기준, 상한 3%
    share = defS*0.7 + atkS*0.3; cap = 3; base = 0.8;
  } else {
    share = atkS*0.5 + defS*0.5; cap = 3; base = 0.8;
  }
  // 팀 내 최상위(share≈팀 최고)면 상한, 낮으면 base 근처로. share는 대략 0~0.5 범위이므로 2배 스케일.
  const scaled = base + Math.min(1, share * 2) * (cap - base);
  return Math.max(0, Math.min(cap, scaled)); // 0~cap %
}

// 상위 기여 선수(패널 표시용): 결장 시 승률 영향(%) 순. GK는 주전 1명만.
function getKeyPlayers(team) {
  const map = getTeamShares(team);
  let gkKept = false;
  return Object.keys(map)
    .map(n => ({
      name: n, pos: map[n].pos,
      atkShare: map[n].atkShare, defShare: map[n].defShare,
      isGk: (map[n].pos||"").toUpperCase()==="GK",
      hasGkRating: typeof map[n].gkRating === "number",
      impactPct: playerImpactPct(team, n),
    }))
    .filter(p => p.impactPct > 0.3)
    .sort((x, y) => {
      // GK는 리더보드 능력치 있는 주전을 우선
      return y.impactPct - x.impactPct || (y.hasGkRating?1:0)-(x.hasGkRating?1:0);
    })
    .filter(p => {
      if (!p.isGk) return true;
      if (gkKept) return false; // 이미 주전 GK 1명 넣었으면 나머지 GK 제외
      gkKept = true; return true;
    })
    .slice(0, 6);
}

// 결장 선수 전역 상태 (팀명 -> Set(선수명))
if (typeof window !== "undefined" && !window.__absentPlayers) window.__absentPlayers = {};
function getAbsentSet(team) {
  if (typeof window === "undefined") return new Set();
  return window.__absentPlayers[team] || new Set();
}

// 결장 선수들의 승률 보정폭 합(%) — 팀 총합은 15%로 캡(가이드: 개인 기여도 최종 10~15%).
function absentWinPenaltyPct(team) {
  const absent = getAbsentSet(team);
  if (!absent.size) return 0;
  let sum = 0;
  for (const name of absent) sum += playerImpactPct(team, name);
  return Math.min(15, sum); // 팀 총 결장 영향 상한 15%p
}

// 공격/수비 손실 비중(λ 조정용, 패널 정보 표시에도 사용)
function absentImpact(team) {
  const absent = getAbsentSet(team);
  if (!absent.size) return { atkLoss: 0, defLoss: 0, winPct: 0 };
  const map = getTeamShares(team);
  let atkLoss = 0, defLoss = 0;
  for (const name of absent) {
    if (map[name]) { atkLoss += map[name].atkShare; defLoss += map[name].defShare; }
  }
  return { atkLoss, defLoss, winPct: absentWinPenaltyPct(team) };
}

function starPlayerLambdaBoost(lambdaHome, lambdaAway, home, away) {
  const hS = (typeof STAR_PLAYERS !== "undefined") ? STAR_PLAYERS[home] : null;
  const aS = (typeof STAR_PLAYERS !== "undefined") ? STAR_PLAYERS[away] : null;
  let lH = lambdaHome, lA = lambdaAway;
  if (hS) lH = lH + (hS.atkBoost || 0);
  if (aS) lH = Math.max(0.15, lH - (aS.gkSave || 0) * 0.5);
  if (aS) lA = lA + (aS.atkBoost || 0);
  if (hS) lA = Math.max(0.15, lA - (hS.gkSave || 0) * 0.5);

  // ── 결장 반영(가이드 강도) ──
  // 개인 기여도는 최종 승률 보정값으로 10~15%만. 팀 결장 총 페널티(%)를
  // 공격 λ에 부드럽게 환산: winPct 1%p ≈ 공격 λ 약 1.3% 감소(상한 30%).
  const hImp = absentImpact(home);
  const aImp = absentImpact(away);
  const toLambda = pct => Math.min(0.30, (pct/100) * 1.3);

  if (hImp.winPct > 0) lH = Math.max(0.12, lH * (1 - toLambda(hImp.winPct)));
  if (aImp.winPct > 0) lA = Math.max(0.12, lA * (1 - toLambda(aImp.winPct)));

  return { lH, lA };
}


// LEADERBOARD: 득점왕/도움왕 — { scorers: {"선수|팀": 골수}, assists: {"선수|팀": 도움수} }.
// 2026-07-18 신규(EPL 앱의 STATIC_LEADERBOARD와 동일 개념/구조를 6개 리그로 포팅).
// collect_goalscorers.py가 실제 26-27 시즌 종료 경기에서 뽑은 득점자만 반영하므로,
// 8월 개막 전에는 비어있는 게 정상이다.
let LEADERBOARD = { scorers: {}, assists: {} };

// 2026-08-01 신규: 카드 결장위험 — {선수명: {team, yellow_total,
// red_on_last_match, last_match_date}}. compute_card_suspensions.py가
// 옐로누적 5장+/레드카드 직전경기 선수만 담아서 준다(그 외는 알릴 게
// 없어서 제외됨 — 용량 절약).
let CARD_SUSPENSIONS = {};

async function loadPipelineData(leagueKey) {
  try {
    await fetchPipelineDataMultileague();
    const globalKey = `PIPELINE_DATA_${leagueKey.toUpperCase()}`;
    const data = (typeof window !== "undefined") ? window[globalKey] : null;
    if (!data) return { scheduleLoaded:false, logosLoaded:false, squadsLoaded:false, xgLoaded:false, injuriesLoaded:false, fatigueLoaded:false, transfersLoaded:false, h2hLoaded:false, leaderboardLoaded:false, playerBaselineLoaded:false };
    let scheduleLoaded = false, logosLoaded = false, squadsLoaded = false, xgLoaded = false, injuriesLoaded = false, fatigueLoaded = false, transfersLoaded = false, h2hLoaded = false, leaderboardLoaded = false, playerBaselineLoaded = false;
    if (Array.isArray(data.schedule) && data.schedule.length) {
      SCHEDULE = data.schedule;
      scheduleLoaded = true;
    }
    if (data.logos && typeof data.logos === "object") {
      Object.assign(CLUB_LOGOS, data.logos);
      logosLoaded = true;
    }
    if (data.elo && typeof data.elo === "object") {
      Object.assign(ELO, data.elo);
    }
    // 2026-08-01 추가: 리그 전환 시 이전 리그 데이터가 안 남게 매번 통째로
    // 교체(다른 전역 변수들처럼 Object.assign으로 누적하면 리그 바뀌어도
    // 이전 리그 선수가 안 지워짐 — 카드 정지는 팀 매칭이라 이게 특히 중요).
    CARD_SUSPENSIONS = (data.cardSuspensions && typeof data.cardSuspensions === "object")
      ? data.cardSuspensions : {};
    if (data.squads && typeof data.squads === "object" && Object.keys(data.squads).length) {
      SQUADS = data.squads;
      squadsLoaded = true;
    }
    if (data.teamXg && typeof data.teamXg === "object" && Object.keys(data.teamXg).length) {
      TEAM_XG = data.teamXg;
      xgLoaded = true;
    }
    // 부상: { 팀명: { keyOut:[...], injured:[...] } } — 아직 파이프라인에 없어도 안전하게 통과
    if (data.injuries && typeof data.injuries === "object" && Object.keys(data.injuries).length) {
      TEAM_INJURIES = data.injuries;
      injuriesLoaded = true;
    }
    // 월드컵 여독: { 팀명: { fatigueScore: 0~1 } } — "조만간" 올라올 예정, 그 전까진 무효과
    if (data.fatigue && typeof data.fatigue === "object" && Object.keys(data.fatigue).length) {
      TEAM_FATIGUE = data.fatigue;
      fatigueLoaded = true;
    }
    // 이적(영입/이탈): { 팀명: { in:[...], out:[...] } } — 2026-07-16 파이프라인에 연결됨
    if (data.transfers && typeof data.transfers === "object" && Object.keys(data.transfers).length) {
      TRANSFERS = data.transfers;
      transfersLoaded = true;
    }
    // H2H: { "팀A|||팀B": [...] } — 2026-07-16 파이프라인에 연결됨 (EPL 앱과 동일 구조)
    if (data.h2h && typeof data.h2h === "object" && Object.keys(data.h2h).length) {
      H2H = data.h2h;
      h2hLoaded = true;
    }
    // LEADERBOARD: { scorers:{}, assists:{} } — 2026-07-18 신규.
    // 8월 개막 전엔 scorers/assists가 둘 다 빈 객체로 오는 게 정상이라 그 경우엔
    // loaded를 true로 안 올린다(=화면에 "데이터 없음" 안내가 뜨게 둠).
    if (data.leaderboard && typeof data.leaderboard === "object" &&
        ((data.leaderboard.scorers && Object.keys(data.leaderboard.scorers).length) ||
         (data.leaderboard.assists && Object.keys(data.leaderboard.assists).length))) {
      LEADERBOARD = data.leaderboard;
      leaderboardLoaded = true;
    }
    // TEAM_GROUP_GAMES: 개인기여도(playerImpactPct) 소스 — 2026-07-29 신규 배선.
    // EPL_index.html의 동일 배선(캐시 클리어 포함)과 정확히 동일 패턴.
    if (data.teamGroupGames && typeof data.teamGroupGames === "object") {
      Object.entries(data.teamGroupGames).forEach(([team, gamesByLabel]) => {
        TEAM_GROUP_GAMES[team] = { ...(TEAM_GROUP_GAMES[team]||{}), ...gamesByLabel };
      });
      if (typeof __teamShareCache !== "undefined") {
        Object.keys(__teamShareCache).forEach(k => delete __teamShareCache[k]);
      }
    }
    // 선수 능력치 기준선(A단계, 2026-07-22): { "이름|국가": {club_en, position, per90, source, ...} }
    // update_player_baseline()이 출력하는 player_baseline.json의 players 필드를 그대로 받는다.
    // 비어있거나 필드가 없으면(파이프라인이 아직 안 붙였으면) 조용히 무효과로 통과.
    if (data.playerBaseline && typeof data.playerBaseline === "object" && Object.keys(data.playerBaseline).length) {
      PLAYER_BASELINE = data.playerBaseline;
      playerBaselineLoaded = true;
    }
    return { scheduleLoaded, logosLoaded, squadsLoaded, xgLoaded, injuriesLoaded, fatigueLoaded, transfersLoaded, h2hLoaded, leaderboardLoaded, playerBaselineLoaded };
  } catch (e) {
    return { scheduleLoaded:false, logosLoaded:false, squadsLoaded:false, xgLoaded:false, injuriesLoaded:false, fatigueLoaded:false, transfersLoaded:false, h2hLoaded:false, leaderboardLoaded:false, playerBaselineLoaded:false };
  }
}

// getKickoffDate: SCHEDULE의 date(YYYY-MM-DD)+time(HH:MM, 파이프라인이 KST로 변환해서 줌)을
// 실제 Date 객체로 변환. "+09:00"을 명시해서 만들기 때문에, 이 앱을 보는 사람이 어느
// 시간대에 있든(내부적으로 Date는 UTC 절대시각을 저장하므로) 정확하게 비교된다.
function getKickoffDate(g) {
  if (!g || !g.date) return null;
  const time = g.time || "00:00";
  const dt = new Date(`${g.date}T${time}:00+09:00`);
  return isNaN(dt.getTime()) ? null : dt;
}

function normTeamStr(s) {
  return String(s || "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
}
function isSameClubName(leagueKey, koName, foreignName) {
  if (!foreignName) return false;
  const target = normTeamStr(foreignName);
  if (!target) return false;
  const en = ENGLISH_NAME[leagueKey]?.[koName];
  const alias = normTeamStr(en || koName);
  if (!alias) return false;
  return alias === target || target.includes(alias) || alias.includes(target);
}

function impliedProbFromOdds(odds) {
  if (typeof odds !== "number" || !isFinite(odds) || odds <= 1) return null;
  return 1 / odds;
}
function devigOdds(oddsObj) {
  if (!oddsObj) return null;
  const ih = impliedProbFromOdds(oddsObj.home), id = impliedProbFromOdds(oddsObj.draw), ia = impliedProbFromOdds(oddsObj.away);
  if (ih == null || id == null || ia == null) return null;
  const sum = ih + id + ia;
  if (!Number.isFinite(sum) || sum <= 0) return null;
  return { home: ih / sum, draw: id / sum, away: ia / sum }; // 마진 제거된 fair 확률
}
function computeEV(modelProb, fairOdds) {
  if (typeof modelProb !== "number" || !fairOdds || fairOdds <= 1) return null;
  return (modelProb * fairOdds) - 1; // 양수면 모델이 시장보다 이 결과를 더 유력하게 봄
}

async function fetchBsdBookmakerOdds(eventId) {
  if (!BSD_TOKEN || eventId == null) return [];
  try {
    const url = `https://sports.bzzoiro.com/api/v2/odds/?event_id=${eventId}&market=1x2&limit=200`;
    const res = await fetchOddsViaProxies(url, { headers: { "Authorization": `Token ${BSD_TOKEN}` } }, 8000);
    const j = res ? await res.json().catch(() => null) : null;
    const rows = Array.isArray(j) ? j : (Array.isArray(j?.results) ? j.results : null);
    if (!Array.isArray(rows) || !rows.length) return [];
    const byBookmaker = {};
    for (const r of rows) {
      if (r.market !== "1x2") continue;
      const slug = r.bookmaker_slug;
      if (!slug || slug === "consensus") continue;
      if (!byBookmaker[slug]) byBookmaker[slug] = { bookmaker: r.bookmaker_name || slug };
      if (r.outcome === "HOME") byBookmaker[slug].home = r.decimal_odds;
      else if (r.outcome === "DRAW") byBookmaker[slug].draw = r.decimal_odds;
      else if (r.outcome === "AWAY") byBookmaker[slug].away = r.decimal_odds;
    }
    return Object.values(byBookmaker).filter(b => b.home != null && b.draw != null && b.away != null);
  } catch (e) {
    return [];
  }
}

  "https://corsproxy.org/?",
];
async function oddsFetchWithTimeout(url, options = {}, timeoutMs = 6000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}
async function fetchOddsViaProxies(url, options = {}, timeoutMs = 6000) {
  for (const p of ODDS_PROXY_FALLBACKS) {
    try {
      const target = p === "DIRECT" ? url : (p + encodeURIComponent(url));
      const res = await oddsFetchWithTimeout(target, options, timeoutMs);
      if (res && res.ok) return res;
    } catch (e) { /* 다음 프록시로 */ }
  }
  return null;
}

async function afCached(key, ttlMs, fetcher) {
  try {
    const r = await window.storage.get(key, false);
    if (r?.value) {
      const cached = JSON.parse(r.value);
      if (cached.ts && (Date.now() - cached.ts) < ttlMs) return cached.data;
    }
  } catch (e) {}
  const data = await fetcher();
  if (data != null) {
    try { await window.storage.set(key, JSON.stringify({ ts: Date.now(), data }), false); } catch (e) {}
  }
  return data;
}

// ============================================================ 예측 엔진 v2 (EPL 앱에서 검증된 순수 함수 이식)
// EPL 앱의 expScore/calcDrawProb/poissonRandom/computeOverUnder/computeMarketStats는
// 다른 데이터(xG·부상·ML모델 등)에 의존하지 않는 순수 함수라 100% 안전하게 그대로 이식했다.
// (Node로 극단적 케이스까지 별도 수치 검증 완료: 확률 합 항상 1, 음수/NaN 없음)
//
// 아직 이식 안 한 것 (데이터가 없어서 이식하면 오작동/무의미한 값이 나오는 부분):
//  - randomForestWinProb(ML 앙상블) — EPL 데이터로 학습된 모델, 다른 리그에 안 맞음
//  - injuryLambdaAdjust/formLambdaAdjust — 실제 부상자/최근결과 데이터 필요
//  - psxgLambdaAdjust/setPieceLambdaAdjust/starPlayerLambdaBoost — 선수 단위 세부스탯 필요
//  - isRivalry — 리그별 라이벌 관계 데이터 필요 (현재 전부 false)
//  - calibrateProbTriple — EPL 실제 결과로 튜닝된 곡선, 다른 리그엔 안 맞음
function expScore(ra, rb) {
  return 1 / (1 + Math.pow(10, (rb - ra) / 400));
}

// ============================================================ 동적 ELO 피드백 (2026-07-25 추가)
// getEffectiveElo: 예측엔진(computeLambdas/predictMatchV2)과 화면 표시가 전부 이 함수를 통해서만
// ELO를 읽는다 — "정적 ELO + 우리가 누적한 델타"가 실질 레이팅. 정적 ELO(ELO[team]) 자체는
// switchLeagueData/loadPipelineData 쪽 코드 말고는 아무도 직접 대입하지 않는다(불변 원칙 유지).
function getEffectiveElo(team) {
  const staticVal = (typeof ELO[team] === "number") ? ELO[team] : 1500;
  const delta = ELO_DELTA[team];
  return staticVal + (typeof delta === "number" ? delta : 0);
}

// 골득실차에 따른 K-factor 가중치 — EPL 앱의 updateEloAfterMatch와 동일한 margin 공식(대승일수록
// 변화폭 확대). 8개리그는 전부 정규리그뿐이라 EPL처럼 스테이지별 K(조별/토너먼트 등) 구분은 불필요.
function eloMarginFactor(homeGoals, awayGoals) {
  const diff = Math.abs(homeGoals - awayGoals);
  return diff <= 1 ? 1 : (diff === 2 ? 1.5 : 1.75);
}
const ELO_DELTA_K = 20; // EPL의 group(정규리그) 단계와 동일 값

// updateEloDelta: 종료경기 1건을 델타에 반영. static ELO는 절대 안 건드리고 ELO_DELTA만 갱신.
function updateEloDelta(home, away, homeGoals, awayGoals) {
  if (!(home in ELO) || !(away in ELO)) return; // 이 리그 소속 팀이 아니면 무시(데이터 오류 방지)
  const homeEff = getEffectiveElo(home) + HOME_ADV;
  const awayEff = getEffectiveElo(away);
  const expectedHome = expScore(homeEff, awayEff);
  let actualHome = 0.5;
  if (homeGoals > awayGoals) actualHome = 1; else if (homeGoals < awayGoals) actualHome = 0;
  const change = ELO_DELTA_K * eloMarginFactor(homeGoals, awayGoals) * (actualHome - expectedHome);
  ELO_DELTA[home] = (ELO_DELTA[home] || 0) + change;
  ELO_DELTA[away] = (ELO_DELTA[away] || 0) - change;
}

// decayEloDeltaForLeague: 파이프라인이 새로 갱신될 때마다 기존 델타를 살짝 줄인다. ClubElo
// 자체도 시간이 지나면 같은 경기 결과를 자기 레이팅에 반영하므로, 우리 델타를 영구히 100%
// 유지하면 "이중 반영"이 된다. 0.85는 임의 초기값 — 실측 근거 없음, 다음 세션에서 조정 검토.
function decayEloDeltaForLeague(factor = 0.85) {
  Object.keys(ELO_DELTA).forEach(t => {
    const v = ELO_DELTA[t] * factor;
    // 델타가 충분히 작아지면(±1 미만) 아예 지워서 ELO_DELTA 객체가 무한정 커지는 것 방지
    if (Math.abs(v) < 1) delete ELO_DELTA[t]; else ELO_DELTA[t] = v;
  });
}

// ============================================================ 감쇠계수(0.85) 튜닝용 진단로그 (2026-07-31 추가)
// 0.85는 "실측 근거 없음"이라고 코드 작성자 본인이 이미 남긴 임의값이다. 제대로
// 튜닝하려면 "ClubElo(외부 정적 ELO 소스)가 실제 경기결과를 자기 레이팅에 반영하는 데
// 며칠/몇 회 파이프라인 주기가 걸리는지"를 알아야 하는데, 이번 세션엔 그 실측 데이터가
// 없다(과거 club_elo.json 스냅샷 없음, 네트워크로 clubelo.com 확인도 불가). 그래서 값은
// 안 건드리고, 델타가 갱신될 때마다(=새 종료경기 반영 시점마다) 그 순간의 정적ELO+델타
// 스냅샷을 기기 로컬(window.storage, localStorage 기반)에 계속 쌓아만 둔다 — 몇 주 뒤
// 이 로그를 보면 "델타가 실제로 정적ELO 변화를 얼마나 잘 예견했는지"가 드러나고, 그때
// 데이터 근거로 0.85를 조정할지 판단한다. 예측 로직(computeLambdas/predictMatchV2 등)
// 에는 전혀 영향 없음 — 순수 관찰용 부가 로그.
const ELO_DIAG_MAX = 150; // 무한정 커지지 않게 최근 150건만 보관(기기 저장공간 보호)

async function _pushEloDiag(leagueKey, entry) {
  try {
    const key = `ml:eloDeltaDiag:${leagueKey}`;
    const r = await window.storage.get(key, false).catch(() => null);
    let log = [];
    if (r && r.value) { try { log = JSON.parse(r.value); } catch (e) { log = []; } }
    log.push(entry);
    if (log.length > ELO_DIAG_MAX) log = log.slice(log.length - ELO_DIAG_MAX);
    await window.storage.set(key, JSON.stringify(log), false);
  } catch (e) { /* 진단로그 저장 실패해도 실제 예측/델타 로직엔 전혀 영향 없음 */ }
}

// applyEloDeltaForNewResults: SCHEDULE의 종료경기 중 아직 델타에 반영 안 한 것만 골라 반영하고,
// 반영한 게 있으면(=파이프라인이 새로 뭔가 가져왔으면) 감쇠도 같이 수행한 뒤 storage에 저장.
// App의 데이터로딩 useEffect에서 loadPipelineData() 완료 직후 호출한다.
async function applyEloDeltaForNewResults(leagueKey) {
  const finished = SCHEDULE.filter(g => g && g.home && g.away &&
    Number.isFinite(g.homeGoals) && Number.isFinite(g.awayGoals));
  const newOnes = finished.filter(g => !ELO_DELTA_PROCESSED.has(`${g.home}|${g.away}|${g.date}`));
  if (!newOnes.length) return false;
  const deltaBeforeDecay = { ...ELO_DELTA };
  decayEloDeltaForLeague();
  const deltaAfterDecay = { ...ELO_DELTA };
  const matchLogs = [];
  for (const g of newOnes) {
    const homeStaticElo = (typeof ELO[g.home] === "number") ? ELO[g.home] : null;
    const awayStaticElo = (typeof ELO[g.away] === "number") ? ELO[g.away] : null;
    const homeDeltaBefore = ELO_DELTA[g.home] || 0;
    const awayDeltaBefore = ELO_DELTA[g.away] || 0;
    updateEloDelta(g.home, g.away, g.homeGoals, g.awayGoals);
    ELO_DELTA_PROCESSED.add(`${g.home}|${g.away}|${g.date}`);
    matchLogs.push({
      home: g.home, away: g.away, date: g.date,
      homeGoals: g.homeGoals, awayGoals: g.awayGoals,
      homeStaticElo, awayStaticElo,
      homeDeltaBefore, awayDeltaBefore,
      homeDeltaAfter: ELO_DELTA[g.home] || 0, awayDeltaAfter: ELO_DELTA[g.away] || 0,
    });
  }
  try {
    await window.storage.set(`wc:eloDelta:${leagueKey}`, JSON.stringify(ELO_DELTA));
    await window.storage.set(`wc:eloDeltaProcessed:${leagueKey}`, JSON.stringify([...ELO_DELTA_PROCESSED]));
  } catch (e) { /* 저장 실패해도 이번 세션 메모리상 델타는 유지 — 다음 갱신 때 재시도됨 */ }
  await _pushEloDiag(leagueKey, {
    at: new Date().toISOString(),
    decayFactor: 0.85,
    deltaBeforeDecay, deltaAfterDecay,
    matches: matchLogs,
  });
  return true;
}

function calcDrawProb(eloDiff) {
  const base = 0.27;
  const closeness = Math.max(0, 1 - Math.abs(eloDiff) / 500);
  return Math.min(0.34, Math.max(0.16, base + closeness * 0.07));
}
function poissonRandom(lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}

function computeOverUnder(scoreCounts, totalSims) {
  const lines = [2.5, 3.5];
  const result = {};
  for (const line of lines) {
    let over = 0;
    for (const [score, count] of Object.entries(scoreCounts)) {
      const [h, a] = score.split("-").map(Number);
      if ((h + a) > line) over += count;
    }
    result[line] = { over: over / totalSims, under: 1 - over / totalSims };
  }
  return result;
}

function computeMarketStats(scoreCounts, totalSims) {
  let bttsYes = 0, homeCS = 0, awayCS = 0;
  const exactDist = Object.entries(scoreCounts)
    .map(([score, count]) => ({ score, prob: count / totalSims }))
    .sort((a, b) => b.prob - a.prob);
  for (const [score, count] of Object.entries(scoreCounts)) {
    const [h, a] = score.split("-").map(Number);
    if (h >= 1 && a >= 1) bttsYes += count;
    if (a === 0) homeCS += count;
    if (h === 0) awayCS += count;
  }
  const p = (x) => x / totalSims;
  return {
    btts: { yes: p(bttsYes), no: 1 - p(bttsYes) },
    cleanSheet: { home: p(homeCS), away: p(awayCS) },
    exactDist: exactDist.slice(0, 5),
  };
}

// getHandicapProbs: EPL 앱(894행)에서 그대로 포팅. scoreCounts/totalSims만 있으면 되는
// 순수 함수라 다른 데이터(xG·부상 등)에 의존하지 않음 — 이식 리스크 없음.
// 홈팀 기준 아시안 핸디캡(-1.5~+1.5)을 줬을 때 홈팀이 그 라인을 커버할 확률.
function getHandicapProbs(scoreCounts, totalSims) {
  // 2026-08-02 확장: ±1.5까지만 있던 걸 ±3까지 확장(마이너스/플러스 핸디캡
  // -1·-2·-3 요청 반영). UI(Object.entries로 그대로 렌더링)는 데이터
  // 기반이라 이 배열만 늘리면 자동으로 박스가 늘어남.
  const handicaps = [-3, -2.5, -2, -1.5, -1.0, -0.5, 0, 0.5, 1.0, 1.5, 2, 2.5, 3];
  const result = {};
  for (const h of handicaps) {
    let cover = 0;
    for (const [score, cnt] of Object.entries(scoreCounts)) {
      const [hg, ag] = score.split("-").map(Number);
      if (hg + h > ag) cover += cnt;
    }
    const key = h > 0 ? `+${h}` : `${h}`;
    result[key] = cover / totalSims;
  }
  return result;
}

const HOME_ADV = 65;

// getAdvancedStatsEstimate: EPL 앱의 getAdvancedStats() 2순위 로직(ELO/xG 기반 근사식)만 이식.
// EPL과 달리 처음부터 "실측 하드코딩 테이블"을 안 두고 이 추정식만 씀 — EPL 쪽에서
// 20팀 전부 동일값(psxg:1.35 등)이 박힌 플레이스홀더 테이블이 실제로는 FBref/FotMob
// 데이터가 아니라 미완성 스켈레톤이었던 게 이번에 확인됐음(EPL_고급지표_인수인계.md).
// 그래서 8개리그 앱은 애초에 그런 "가짜 실측값" 테이블 없이, 항상 ELO+xG 기반 추정치임을
// estimated:true로 명시하고 시작함 — FBref/FotMob을 표방하지 않음(정직한 라벨).
function getAdvancedStatsEstimate(team) {
  const xgData = TEAM_XG[team];
  if (!xgData || !Number.isFinite(xgData.xG) || !Number.isFinite(xgData.xGA)) return null; // xG 자체가 없으면 억지로 추정 안 함
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const xG = xgData.xG, xGA = xgData.xGA;
  const npXg = xG * 0.9; // EPL 앱도 npXg 없을 때 쓰는 동일 폴백
  const base = getEffectiveElo(team);

  const psxg = clamp((xG * 0.55 + npXg * 0.45), 0.85, 2.25);
  const psxgAllowed = clamp(xGA * 0.98, 0.65, 1.50);
  const bigChances = clamp(xG * 1.55, 1.3, 4.0);
  const bigChancesAllowed = clamp(xGA * 1.65, 1.0, 2.4);
  const shotQuality = clamp(0.092 + (base - 1400) / 7000 + (xG - 1.3) * 0.010, 0.075, 0.150);

  return {
    psxg: +psxg.toFixed(2),
    psxgAllowed: +psxgAllowed.toFixed(2),
    bigChances: +bigChances.toFixed(1),
    bigChancesAllowed: +bigChancesAllowed.toFixed(1),
    shotQuality: +shotQuality.toFixed(3),
    estimated: true,
  };
}

}

// 리그별 실제 2025-26 시즌 경기당 평균 득점 (soccerstats.com / sportstats365.com 확인)
// 라리가·분데스리가는 홈/원정 분리 데이터까지 실측(soccerstats.com). 나머지 4개 리그는
// 홈/원정 분리 데이터를 못 구해서, 확인된 두 리그의 평균 홈 득점 비중(56.7%)을 적용한 추정치.
const LEAGUE_LAMBDA = {
  laliga:       { home: 1.57, away: 1.11 }, // 실측: soccerstats.com 2025-26
  bundesliga:   { home: 1.78, away: 1.46 }, // 실측: soccerstats.com 2025-26
  seriea:       { home: 1.38, away: 1.05 }, // 추정 (총 2.43골/경기, sportstats365)
  ligue1:       { home: 1.61, away: 1.23 }, // 추정 (총 2.83골/경기, sportstats365)
  eredivisie:   { home: 1.80, away: 1.38 }, // 추정 (총 3.18골/경기, sportstats365)
  championship: { home: 1.48, away: 1.13 }, // 추정 (총 2.61골/경기, sportstats365)
  // 2026-07-24 추가: 실측 footystats.org (2026 시즌 진행 중 데이터 기준)
  mls:          { home: 1.91, away: 1.38 },
  eliteserien:  { home: 1.85, away: 1.13 },
};

// computeLambdas: Elo+리그평균+xG블렌딩+라이벌보정으로 홈/원정 득점 기댓값(λ)을 계산.
// predictMatchV2(개별 경기 예측)와 simulateSeason(시즌 전체 시뮬레이션)이 동일 로직을 공유—
// 두 군데서 따로 구현하면 나중에 한쪽만 고치고 다른 쪽을 안 고치는 실수가 생기기 쉬워서 분리함.
// ML 앙상블 (2026-07-16 착수) — train_ml_ensemble.py가 EPL+6개 리그 통합으로
// 학습한 로지스틱 회귀 계수를 그대로 JS에서 재현한다(다항 로지스틱=소프트맥스).
// window.PIPELINE_ML_ENSEMBLE이 없으면(학습 표본 부족으로 스킵됐거나 아직
// 파이프라인 미실행) null을 반환 — predictMatchV2가 이 경우 ML 블렌딩을
// 건너뛰고 기존 Elo+몬테카를로 예측만 쓴다(항상 안전한 폴백).
function mlXgFeature(homeName, awayName) {
  const h = TEAM_XG[homeName], a = TEAM_XG[awayName];
  if (h && a && Number.isFinite(h.xG) && Number.isFinite(h.xGA) &&
      Number.isFinite(a.xG) && Number.isFinite(a.xGA)) {
    return { xgDiff: (h.xG - a.xGA) - (a.xG - h.xGA), hasXg: 1 };
  }
  return { xgDiff: 0, hasXg: 0 };
}

function mlEnsembleProbs(eloDiff, xgDiff, hasXg) {
  const m = (typeof window !== "undefined") ? window.PIPELINE_ML_ENSEMBLE : null;
  if (!m || !Array.isArray(m.coef) || !Array.isArray(m.intercept) || !Array.isArray(m.classes)) return null;
  const feats = [eloDiff, xgDiff, hasXg];
  const scores = m.classes.map((_, ci) => {
    const row = m.coef[ci] || [];
    let s = m.intercept[ci] || 0;
    for (let i = 0; i < feats.length; i++) s += (row[i] || 0) * feats[i];
    return s;
  });
  const maxS = Math.max(...scores);
  const exps = scores.map(s => Math.exp(s - maxS));
  const sumExp = exps.reduce((a, b) => a + b, 0) || 1;
  const probs = exps.map(e => e / sumExp);
  const out = { H: 0, D: 0, A: 0 };
  m.classes.forEach((c, i) => { out[c] = probs[i]; });
  return out;
}

function computeLambdas(leagueKey, homeName, awayName) {
  const homeElo = getEffectiveElo(homeName) + HOME_ADV;
  const awayElo = getEffectiveElo(awayName);
  const eloDiff = homeElo - awayElo;
  const eloLambdaFactor = Math.max(-0.35, Math.min(0.35, eloDiff / 200 * 0.18));
  const lgBase = LEAGUE_LAMBDA[leagueKey] || LEAGUE_LAMBDA.laliga;
  let lambdaHome = Math.max(0.15, lgBase.home * (1 + eloLambdaFactor));
  let lambdaAway = Math.max(0.15, lgBase.away * (1 - eloLambdaFactor));

  // xG 블렌딩 — TEAM_XG는 24-25/25-26 시즌 평균 xG(공격)/xGA(수비)다. 26-27 신규
  // 승격팀은 상위리그 xG 기록 자체가 없어서 TEAM_XG에 항목이 없을 수 있다 — 그 경우
  // 이 블록을 건너뛰고 기존 ELO 전용 람다를 그대로 쓴다(항상 안전한 폴백 유지).
  const homeXg = TEAM_XG[homeName], awayXg = TEAM_XG[awayName];
  let xgBlended = false;
  if (homeXg && awayXg &&
      Number.isFinite(homeXg.xG) && Number.isFinite(homeXg.xGA) &&
      Number.isFinite(awayXg.xG) && Number.isFinite(awayXg.xGA)) {
    const xgLambdaHome = Math.max(0.15, (homeXg.xG + awayXg.xGA) / 2);
    const xgLambdaAway = Math.max(0.15, (awayXg.xG + homeXg.xGA) / 2);
    const XG_WEIGHT = 0.3;
    lambdaHome = lambdaHome * (1 - XG_WEIGHT) + xgLambdaHome * XG_WEIGHT;
    lambdaAway = lambdaAway * (1 - XG_WEIGHT) + xgLambdaAway * XG_WEIGHT;
    xgBlended = true;
  }

  // 더비/라이벌 매치: λ를 평균 쪽으로 8% 수렴시켜 접전 스코어 유도 (EPL 앱과 동일 공식)
  const rivalry = isRivalry(leagueKey, homeName, awayName);
  if (rivalry) {
    const mid = (lambdaHome + lambdaAway) / 2;
    lambdaHome = lambdaHome * 0.92 + mid * 0.08;
    lambdaAway = lambdaAway * 0.92 + mid * 0.08;
  }

  // 부상자 보정 (TEAM_INJURIES 비어있으면 factor=1, 즉 무효과)
  const inj = injuryLambdaAdjust(homeName, awayName);
  lambdaHome = Math.max(0.15, lambdaHome * inj.homeFactor);
  lambdaAway = Math.max(0.15, lambdaAway * inj.awayFactor);

  // 월드컵 여독 보정 (TEAM_FATIGUE 비어있으면 factor=1, 즉 무효과)
  lambdaHome = Math.max(0.15, lambdaHome * fatigueLambdaAdjust(homeName));
  lambdaAway = Math.max(0.15, lambdaAway * fatigueLambdaAdjust(awayName));

  // 선수 능력치 기준선 보정 (A단계) — 팀당 source=league 매칭 선수가 PLAYER_MIN_SAMPLE
  // 미만이면 항상 factor=1(무효과). 개막 초반엔 거의 항상 이 상태가 정상이다.
  const homePlayer = playerLambdaAdjust(leagueKey, homeName);
  const awayPlayer = playerLambdaAdjust(leagueKey, awayName);
  lambdaHome = Math.max(0.15, lambdaHome * homePlayer.factor);
  lambdaAway = Math.max(0.15, lambdaAway * awayPlayer.factor);

  // 2026-07-29 EPL 앱에서 이식: 결장 선수 개인기여도(playerImpactPct) 반영.
  // 사용자가 결장 선수를 지정하면(AbsenceSummaryPanel → window.__absentPlayers)
  // starPlayerLambdaBoost가 그 선수의 팀 내 기여 비중만큼 λ를 감소시킨다.
  // 결장자 없으면 absentImpact()가 {winPct:0}을 반환해서 완전 무효과.
  const starAdj = starPlayerLambdaBoost(lambdaHome, lambdaAway, homeName, awayName);
  lambdaHome = starAdj.lH;
  lambdaAway = starAdj.lA;

  return { lambdaHome, lambdaAway, eloDiff, xgBlended, rivalry,
    injuryApplied: inj.homeFactor < 1 || inj.awayFactor < 1,
    fatigueApplied: (TEAM_FATIGUE[homeName]?.fatigueScore > 0) || (TEAM_FATIGUE[awayName]?.fatigueScore > 0),
    playerBaselineApplied: homePlayer.applied || awayPlayer.applied };
}


function predictMatchV2(leagueKey, homeName, awayName, sims = 100000) {
  const homeElo = getEffectiveElo(homeName) + HOME_ADV;
  const awayElo = getEffectiveElo(awayName);
  const eloDiff = homeElo - awayElo;

  const winProbRaw = expScore(homeElo, awayElo);
  const drawProbRaw = calcDrawProb(eloDiff);
  let homeWinProb = winProbRaw * (1 - drawProbRaw);
  let awayWinProb = (1 - winProbRaw) * (1 - drawProbRaw);
  let drawProb = drawProbRaw;

  const { lambdaHome, lambdaAway, xgBlended, rivalry, injuryApplied, fatigueApplied, playerBaselineApplied } = computeLambdas(leagueKey, homeName, awayName);

  // 더비/라이벌 매치: 전력차 완화 + 무승부 확률 상승(EPL 앱과 동일 공식, λ 수렴은 computeLambdas에서 이미 처리됨)
  if (rivalry) {
    const favComp = 0.90; // 승패 확률을 10% 무승부 쪽으로 압축
    homeWinProb *= favComp;
    awayWinProb *= favComp;
    drawProb = Math.max(0.02, 1 - homeWinProb - awayWinProb);
  }

  const safeSims = Number.isFinite(sims) && sims > 0 ? Math.floor(sims) : 100000;
  let hw = 0, dr = 0, aw = 0;
  const scoreCounts = {};
  for (let i = 0; i < safeSims; i++) {
    const hg = poissonRandom(lambdaHome);
    const ag = poissonRandom(lambdaAway);
    if (hg > ag) hw++; else if (hg < ag) aw++; else dr++;
    const key = `${hg}-${ag}`;
    scoreCounts[key] = (scoreCounts[key] || 0) + 1;
  }
  const mcHome = hw / safeSims, mcDraw = dr / safeSims, mcAway = aw / safeSims;
  let finalHome = (homeWinProb + mcHome) / 2;
  let finalDraw = (drawProb + mcDraw) / 2;
  let finalAway = (awayWinProb + mcAway) / 2;
  const total = finalHome + finalDraw + finalAway;
  finalHome /= total; finalDraw /= total; finalAway /= total;

  // ML 앙상블 블렌딩 (2026-07-16) — Elo+몬테카를로 결과에 20% 가중치로 섞는다.
  // xG 블렌딩(30%)보다 가중치를 낮게 잡은 이유: xG는 실제 슈팅 데이터 기반인
  // 반면 ML은 아직 학습 표본이 적을 26-27 시즌 초반 데이터로 만들어졌을
  // 가능성이 높아 과신하지 않는 게 안전하다.
  const { xgDiff: mlXgDiff, hasXg: mlHasXg } = mlXgFeature(homeName, awayName);
  const mlProbs = mlEnsembleProbs(eloDiff, mlXgDiff, mlHasXg);
  let mlApplied = false;
  if (mlProbs) {
    const ML_WEIGHT = 0.2;
    finalHome = finalHome * (1 - ML_WEIGHT) + mlProbs.H * ML_WEIGHT;
    finalDraw = finalDraw * (1 - ML_WEIGHT) + mlProbs.D * ML_WEIGHT;
    finalAway = finalAway * (1 - ML_WEIGHT) + mlProbs.A * ML_WEIGHT;
    const total2 = finalHome + finalDraw + finalAway;
    finalHome /= total2; finalDraw /= total2; finalAway /= total2;
    mlApplied = true;
  }

  const topScores = Object.entries(scoreCounts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([score, count]) => ({ score, prob: count / safeSims }));

  return {
    home: homeName, away: awayName,
    homeWinProb: finalHome, drawProb: finalDraw, awayWinProb: finalAway,
    eloOnly: { homeWinProb, drawProb, awayWinProb },
    monteCarlo: { homeWinProb: mcHome, drawProb: mcDraw, awayWinProb: mcAway },
    lambdaHome, lambdaAway, eloDiff,
    xgBlended,  // true면 이 경기는 실제 xG 데이터가 반영된 예측 (2026-07-15 추가)
    rivalry,    // true면 더비/라이벌 매치 보정이 적용된 예측
    injuryApplied,  // true면 부상자 데이터가 반영된 예측 (데이터 도착 전엔 항상 false)
    fatigueApplied, // true면 월드컵 여독 데이터가 반영된 예측 (데이터 도착 전엔 항상 false)
    playerBaselineApplied, // true면 선수 능력치 기준선(A단계)이 반영된 예측 (개막 후 팀당 표본이 쌓이기 전엔 항상 false)
    mlApplied,      // true면 ML 앙상블이 반영된 예측 (학습 표본 부족 시 항상 false)
    topScores,
    overUnder: computeOverUnder(scoreCounts, safeSims),
    marketStats: computeMarketStats(scoreCounts, safeSims),
    handicapProbs: getHandicapProbs(scoreCounts, safeSims),
    sims: safeSims,
  };
}

// 리그별 강등권 크기 (근사치 — 리그앙/에레디비시/챔피언십처럼 플레이오프가 얽힌 경우도
// 있어서 정확한 승강 규정과 100% 일치하진 않음. "하위권 위험도" 참고용으로만 표시)
const RELEGATION_ZONE = {
  laliga: 3, bundesliga: 2, seriea: 3, ligue1: 2, eredivisie: 2, championship: 3,
  // 2026-07-24 추가: MLS는 강등제 자체가 없음(컨퍼런스+플레이오프 구조) → 0으로
  // 명시(없으면 ?? 3 기본값이 적용돼 잘못된 강등권을 계산하게 됨). 엘리테세리엔은
  // 실측(위키피디아 2026 시즌 문서) 2팀 강등.
  mls: 0, eliteserien: 2,
};

// simulateSeason: 실제 SCHEDULE(전체 시즌 일정)을 몬테카를로로 N번 통째로 돌려서
// 팀별 우승 확률·강등권 확률을 추정. 개별 경기 예측(predictMatchV2)과 같은 λ 계산
// (computeLambdas)을 공유하기 때문에 결과가 서로 어긋나지 않는다.
// SCHEDULE에 없는 팀명이 fixture에 섞여 있으면(파이프라인 데이터 오류 대비) 그 경기는
// 조용히 건너뛴다 — 시즌 시뮬레이션 전체가 깨지는 것보다 안전.
// 2026-07-24 수정: fixture에 homeGoals/awayGoals(실제 치른 경기, computeStandingsTable과
// 동일 판별 기준)가 있으면 그 실제 스코어를 그대로 승점에 반영하고, 시뮬레이션 대상에서는
// 뺀다 — 이미 끝난 경기까지 매번 새로 무작위 재시뮬레이션하던 걸 고침(6개 리그는 전부
// 개막 전이라 여태 이 경로가 한 번도 안 타서 안 드러났었음).
function simulateSeason(leagueKey, sims = 500) {
  const teams = LEAGUES[leagueKey].teams;
  if (!SCHEDULE.length) return null;

  // 실제 결과(치른 경기)와 남은 경기를 미리 한 번만 분리 — 시뮬레이션마다 다시 안 나눔.
  const basePoints = {}, baseGf = {}, baseGa = {};
  teams.forEach(t => { basePoints[t] = 0; baseGf[t] = 0; baseGa[t] = 0; });
  const remainingFixtures = [];
  let playedCount = 0, validFixtures = 0;
  for (const fixture of SCHEDULE) {
    const { home, away, homeGoals, awayGoals } = fixture || {};
    if (!basePoints.hasOwnProperty(home) || !basePoints.hasOwnProperty(away)) continue;
    validFixtures++; // 팀명 둘 다 확인된 경기(치른 경기+남은 경기 합계) — 기존 의미 유지
    if (Number.isFinite(homeGoals) && Number.isFinite(awayGoals)) {
      playedCount++;
      baseGf[home] += homeGoals; baseGa[home] += awayGoals;
      baseGf[away] += awayGoals; baseGa[away] += homeGoals;
      if (homeGoals > awayGoals) basePoints[home] += 3;
      else if (homeGoals < awayGoals) basePoints[away] += 3;
      else { basePoints[home] += 1; basePoints[away] += 1; }
    } else {
      remainingFixtures.push({ home, away });
    }
  }

  const titleCount = {}, relegationCount = {};
  teams.forEach(t => { titleCount[t] = 0; relegationCount[t] = 0; });
  const zoneSize = RELEGATION_ZONE[leagueKey] ?? 3;
  const safeSims = Number.isFinite(sims) && sims > 0 ? Math.floor(sims) : 500;

  for (let s = 0; s < safeSims; s++) {
    const points = { ...basePoints }, gf = { ...baseGf }, ga = { ...baseGa };

    for (const fixture of remainingFixtures) {
      const { home, away } = fixture;
      const { lambdaHome, lambdaAway } = computeLambdas(leagueKey, home, away);
      const hg = poissonRandom(lambdaHome), ag = poissonRandom(lambdaAway);
      gf[home] += hg; ga[home] += ag; gf[away] += ag; ga[away] += hg;
      if (hg > ag) points[home] += 3;
      else if (hg < ag) points[away] += 3;
      else { points[home] += 1; points[away] += 1; }
    }

    const table = teams.slice().sort((a, b) => {
      if (points[b] !== points[a]) return points[b] - points[a];
      return (gf[b] - ga[b]) - (gf[a] - ga[a]); // 골득실 타이브레이커
    });
    titleCount[table[0]]++;
    for (let i = teams.length - zoneSize; i < teams.length; i++) relegationCount[table[i]]++;
  }

  return {
    zoneSize,
    playedCount,
    validFixtures,
    totalFixtures: SCHEDULE.length,
    table: teams.map(t => ({
      team: t,
      titleProb: titleCount[t] / safeSims,
      relegationProb: relegationCount[t] / safeSims,
    })).sort((a, b) => b.titleProb - a.titleProb || b.relegationProb - a.relegationProb),
  };
}

// ============================================================ 팀 스타일 레이더 (EPL 앱 RadarChart 순수 SVG 로직 그대로 이식)
// EPL 앱은 xG/xGA/압박강도/필드틸트/세트피스/최근폼 6축을 쓰지만, 우리는 지금
// xG/xGA/ELO 3개 데이터만 있어서 3축으로 축소했다. 다른 축은 해당 데이터(PPDA,
// 필드틸트, 폼 등)가 파이프라인에 들어오면 그때 추가하면 된다.
const RADAR_AXES = ["공격(xG)", "수비", "ELO"];

function getTeamRadarProfile(leagueKey, team) {
  const teams = LEAGUES[leagueKey].teams;
  const raw = {};
  for (const t of teams) {
    const xg = TEAM_XG[t];
    const xG = xg && Number.isFinite(xg.xG) ? xg.xG : 1.35;
    const xGA = xg && Number.isFinite(xg.xGA) ? xg.xGA : 1.35;
    raw[t] = { "공격(xG)": xG, "수비": -xGA, "ELO": getEffectiveElo(t) };
  }
  const norm = {};
  teams.forEach(t => { norm[t] = {}; });
  for (const ax of RADAR_AXES) {
    const vals = teams.map(t => raw[t][ax]);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = max - min;
    for (const t of teams) norm[t][ax] = range > 1e-9 ? ((raw[t][ax] - min) / range) * 100 : 50;
  }
  // 2026-08-01 추가: 프리시즌 친선전 상대팀처럼 이 리그 teams 목록에 아예
  // 없는 팀이면 raw[team]/norm[team]이 undefined가 돼서 화면이 크래시
  // 났다(EPL 앱에서 실측 확인된 동일 버그 — 8개리그도 동일 구조라 선제
  // 방어). 데이터 없는 팀은 중립값으로 안전하게 반환.
  if (!raw[team] || !norm[team]) {
    const neutralNorm = {};
    for (const ax of RADAR_AXES) neutralNorm[ax] = 50;
    return {
      raw: { "공격(xG)": 1.35, "수비": -1.35, "ELO": 1500 },
      norm: neutralNorm,
      noData: true,
    };
  }
  return { raw: raw[team], norm: norm[team] };
}

function RadarChart({ axes, series, size = 220 }) {
  const center = size / 2;
  const radius = size / 2 - 40;
  const labelRadius = radius + 22;
  const angleStep = (Math.PI * 2) / axes.length;
  const ptAt = (value, i, r = radius) => {
    const angle = -Math.PI / 2 + i * angleStep;
    const rr = (value / 100) * r;
    return [center + rr * Math.cos(angle), center + rr * Math.sin(angle)];
  };
  const gridLevels = [20, 40, 60, 80, 100];
  return (
    <svg width={size} height={size} style={{display:"block", margin:"0 auto"}}>
      {gridLevels.map(lvl => (
        <polygon key={lvl} points={axes.map((_, i) => ptAt(lvl, i).join(",")).join(" ")}
          fill="none" stroke={T.border} strokeWidth={1}/>
      ))}
      {axes.map((_, i) => {
        const [x, y] = ptAt(100, i);
        return <line key={i} x1={center} y1={center} x2={x} y2={y} stroke={T.border} strokeWidth={1}/>;
      })}
      {series.map((s, si) => (
        <polygon key={si} points={s.values.map((v, i) => ptAt(v, i).join(",")).join(" ")}
          fill={s.color} fillOpacity={0.22} stroke={s.color} strokeWidth={2}/>
      ))}
      {axes.map((label, i) => {
        const angle = -Math.PI / 2 + i * angleStep;
        const x = center + labelRadius * Math.cos(angle);
        const y = center + labelRadius * Math.sin(angle);
        return (
          <text key={i} x={x} y={y} fill={T.muted} fontSize={10} fontWeight={700}
            textAnchor="middle" dominantBaseline="middle">{label}</text>
        );
      })}
    </svg>
  );
}

function TeamStyleRadarCard({ leagueKey, home, away }) {

  // 리그에 xG가 있다는 이유로 경고가 안 뜨던 버그. 이 리그 소속 팀 기준으로
  // 다시 체크한다.

  );

// 2026-08-02 신규: 헤더골/페널티골/프리킥골/슈팅/유효슈팅/키패스/드리블/
// 태클/인터셉트/클리어링/경고/퇴장 — 예전엔 20인 전역 랭킹(LeaderboardTab)
// 이었는데, "득점/도움/선방처럼 실제 시상 있는 것만 랭킹으로 남기고
// 나머지는 지금 보는 두 팀끼리 비교하게 해달라"는 피드백 반영. LEADERBOARD
// 는 선수 단위({"이름|팀": 값})라, 팀 스탯 합계를 여기서 직접 구한다.
// 출전경기/출전시간은 뺐음 — 스쿼드 인원 많은 팀이 그냥 유리해지는
// 합계라 팀 대 팀 비교로는 의미가 약함(선수 개인 기록으로 보는 게 맞음).
function getTeamStatTotal(metric, team) {
  const src = LEADERBOARD[metric] || {};
  let sum = 0;
  for (const key in src) {
    const idx = key.lastIndexOf("|");
    if (idx >= 0 && key.slice(idx + 1) === team) sum += (src[key] || 0);
  }
  return sum;
}

function LeaderboardStatsCompareCard({ leagueKey, home, away }) {
  const ROWS = [
    { metric: "headerGoals", label: "🎯 헤더골" },
    { metric: "penaltyGoals", label: "🥅 페널티골" },
    { metric: "freeKickGoals", label: "🎯 프리킥골" },
    { metric: "shots", label: "👟 슈팅" },
    { metric: "sot", label: "🎯 유효슈팅" },
    { metric: "keyPasses", label: "🔑 키패스" },
    { metric: "dribbles", label: "⚡ 드리블" },
    { metric: "tacklesWon", label: "🛡 태클" },
    { metric: "interceptions", label: "✋ 인터셉트" },
    { metric: "clearances", label: "🧹 클리어링" },
    { metric: "yellowCards", label: "🟨 경고", higherBetter: false },
    { metric: "redCards", label: "🟥 퇴장", higherBetter: false },
  ];
  const data = ROWS.map(r => ({
    ...r,
    hVal: getTeamStatTotal(r.metric, home),
    aVal: getTeamStatTotal(r.metric, away),
  }));
  const hasAny = data.some(r => r.hVal > 0 || r.aVal > 0);
  if (!hasAny) return null;

  const StatRow = ({ label, hVal, aVal, higherBetter = true }) => {
    const hGood = higherBetter ? hVal > aVal : hVal < aVal && aVal > 0;
    const aGood = higherBetter ? aVal > hVal : aVal < hVal && hVal > 0;
    return (
      <div style={{display:"flex", alignItems:"center", gap:6, padding:"5px 0", borderBottom:`1px solid ${T.border}`}}>
        <span style={{flex:1, textAlign:"right", fontSize:13, fontWeight:700, color: hGood?T.green:T.text}}>{hVal}</span>
        <span style={{width:110, textAlign:"center", fontSize:12, color:T.muted}}>{label}</span>
        <span style={{flex:1, textAlign:"left", fontSize:13, fontWeight:700, color: aGood?T.green:T.text}}>{aVal}</span>
      </div>
    );
  };

  return (
    <Card>
      <div style={{textAlign:"center", marginBottom:8}}>
        <span style={{fontSize:12, color:T.muted}}>← {home}</span>
        <span style={{fontSize:13, fontWeight:700, color:T.text, margin:"0 10px"}}>📋 세부기록 비교</span>
        <span style={{fontSize:12, color:T.muted}}>{away} →</span>
      </div>
      {data.map(r => <StatRow key={r.metric} {...r}/>)}
      <div style={{fontSize:10, color:T.dim, marginTop:6, textAlign:"center"}}>
        📐 이번 시즌 팀 스쿼드 누적치 비교(경기수 보정 없음) · 초록색 = 비교 우위
      </div>
    </Card>
  );
}

// ============================================================ 라이브 인플레이 재계산 (EPL 앱 이식)
function LiveInPlayPanel({home, away, lambdaHome, lambdaAway}) {
  const [active, setActive] = useState(false);
  const [hg, setHg] = useState("0");
  const [ag, setAg] = useState("0");
  const [minute, setMinute] = useState(45);
  const [live, setLive] = useState(null);
  const [busy, setBusy] = useState(false);

  const recalc = useCallback(() => {
    const curH = Math.max(0, Number(hg)||0);
    const curA = Math.max(0, Number(ag)||0);
    const min = Math.min(90, Math.max(0, Number(minute)||0));
    setBusy(true);
    setTimeout(() => {
      const remainFrac = Math.max(0, (90 - min) / 90);
      const rlh = Math.max(0.02, lambdaHome * remainFrac);
      const rla = Math.max(0.02, lambdaAway * remainFrac);
      const sims = 30000;
      let hw=0, dr=0, aw=0;
      const scoreCounts = {};
      for (let i=0;i<sims;i++) {
        const addH = poissonRandom(rlh);
        const addA = poissonRandom(rla);
        const fh = curH + addH, fa = curA + addA;
        if (fh > fa) hw++; else if (fh < fa) aw++; else dr++;
        const key = `${fh}-${fa}`;
        scoreCounts[key] = (scoreCounts[key]||0)+1;
      }
      const topScores = Object.entries(scoreCounts).sort((a,b)=>b[1]-a[1]).slice(0,3)
        .map(([score,count])=>({score, prob:count/sims}));
      setLive({ homeWinProb: hw/sims, drawProb: dr/sims, awayWinProb: aw/sims, topScores, minute: min, curH, curA, remainFrac });
      setBusy(false);
    }, 20);
  }, [hg, ag, minute, lambdaHome, lambdaAway]);

  return (

// ============================================================ 예측 근거 설명 카드 (EPL 앱 이식, 이 앱 result 필드에 맞춤)
function PredictionExplainCard({home, away, result}) {
  if (!result) return null;
  const items = [];

  if (Math.abs(result.eloDiff||0) > 10) {
    const favored = result.eloDiff > 0 ? home : away;
    items.push({icon:"📊", text:`ELO 전력 차이가 약 ${Math.abs(Math.round(result.eloDiff))}점으로, ${favored} 쪽에 유리하게 작용했습니다.`});
  }
  if (result.rivalry) {
    items.push({icon:"🔥", text:"두 팀은 더비/라이벌전으로 분류되어, 전력 차와 무관하게 접전(무승부 확률 상승) 보정이 적용됐습니다."});
  }
  if (result.xgBlended) {
    items.push({icon:"📈", text:"실제 xG(기대득점) 데이터가 30% 비중으로 반영된 예측입니다."});
  } else {
    items.push({icon:"⚠️", text:"이 매치업은 xG 실데이터가 아직 없어(신규 승격팀 등) ELO 기준으로만 계산됐습니다."});
  }
  if (result.injuryApplied) {
    items.push({icon:"🩹", text:"결장 선수 정보가 득점 기대치에 반영됐습니다."});
  }
  if (result.fatigueApplied) {
    items.push({icon:"✈️", text:"월드컵 등 국가대표 소집 여독이 반영됐습니다."});
  }
  if (result.playerBaselineApplied) {
    items.push({icon:"🧬", text:"실제 26-27시즌 기록으로 갱신된 선수 능력치 기준선이 소폭(±8% 이내) 반영됐습니다."});
  }
  const lambdaDiff = (result.lambdaHome||0) - (result.lambdaAway||0);
  if (Math.abs(lambdaDiff) > 0.3) {
    const favored = lambdaDiff > 0 ? home : away;
    items.push({icon:"⚽", text:`기대득점(λ) 기준으로도 ${favored} 쪽이 더 많은 득점이 예상됩니다.`});
  }
  if (!items.length) items.push({icon:"⚖️", text:"뚜렷하게 기운 요인 없이 대체로 균형 잡힌 매치업으로 나타났습니다."});

  return (
    <Card>
      <div style={{fontSize:12, fontWeight:700, color:T.text, marginBottom:2}}>🧠 예측 근거</div>
      <div style={{fontSize:10, color:T.dim, marginBottom:8}}>이번 예측 확률에 영향을 준 주요 요인들입니다</div>
      <div style={{display:"flex", flexDirection:"column", gap:8}}>
        {items.slice(0,6).map((it,i) => (
          <div key={i} style={{display:"flex", gap:8, fontSize:12, color:T.text, lineHeight:1.5}}>
            <span>{it.icon}</span><span>{it.text}</span>
          </div>
        ))}
      </div>
    </Card>
  );
}

// ============================================================ 배당 비교 대시보드 (EPL 앱 이식)
// 기존 fetchMatchOdds는 첫 북메이커만 썼는데, 여기서는 응답에 담긴 전체 북메이커를 추출한다.
function extractAllBookmakerOddsFromOddsApiIo(leagueKey, home, away, data, swapped) {
  if (!data) return [];
  const candidates = [];
  if (Array.isArray(data?.bookmakers)) candidates.push(...data.bookmakers);
  if (Array.isArray(data?.data?.bookmakers)) candidates.push(...data.data.bookmakers);
  const out = [];
  for (const bk of candidates) {
    const markets = bk?.markets || bk?.odds || [];
    if (!Array.isArray(markets)) continue;
    const h2h = markets.find(m => {
      const key = (m.key || m.market || m.name || "").toLowerCase();
      return key.includes("h2h") || key.includes("1x2") || key.includes("match winner");
    });
    if (!h2h || !Array.isArray(h2h.outcomes)) continue;
    let oh=null, od=null, oa=null;
    for (const o of h2h.outcomes) {
      const price = o.price ?? o.odds ?? o.value;
      if (typeof price !== "number") continue;
      const name = (o.name || o.label || "");
      if (/^draw$/i.test(name)) od = price;
      else if (isSameClubName(leagueKey, swapped ? away : home, name)) oh = price;
      else if (isSameClubName(leagueKey, swapped ? home : away, name)) oa = price;
    }
    if (oh == null || oa == null) continue;
    const bkName = bk.name || bk.key || bk.title || bk.bookmaker || "북메이커";
    out.push(swapped ? { bookmaker: bkName, home: oa, draw: od, away: oh } : { bookmaker: bkName, home: oh, draw: od, away: oa });
  }
  return out;
}

// ============================================================ The Odds API 이식 (2026-07-31 추가)
// odds-api.io 무료플랜은 "북메이커 2곳"만 주는 구조라, MLS·엘리테세리엔처럼 마이너
// 리그는 애초에 그 2곳이 마켓을 안 열어놨을 가능성이 높다(실사용 중 계속 "못 찾음"으로
// 확인됨). the-odds-api.com은 공식 스포츠 목록에 Eliteserien·MLS 둘 다 명시돼 있어서
// (2026-07-31 웹검색으로 확인) 보강 소스로 추가한다. 단 무료플랜이 월 500콜(odds-api.io
// 일 500콜보다 훨씬 빡빡)이라 캐시를 길게 잡는다.
// ⚠️ sport_key 정확한 문자열(예: "soccer_norway_eliteserien")은 공식 문서 직접 접근이
// 안 돼서 확정 못 함 — 이 프로젝트 전체 원칙(리그ID 숫자/문자열 추측 금지, 실제 응답으로
// 검증)과 동일하게, /v4/sports를 실제로 불러서 title 패턴매칭으로 역발견한다. 매칭
// 애매하면(후보 2개 이상, 또는 0개) console.warn으로 남기니 브라우저 콘솔로 검증할 것.
const THE_ODDS_API_KEY = "975c520ef6d6bcb08c22607596bf8022"; // EPL 앱과 동일한 실제 키
const THE_ODDS_SPORT_PATTERNS = {
  laliga:       { include: /la ?liga/i,        exclude: /(la ?liga ?2|segunda|2\b)/i },
  bundesliga:   { include: /bundesliga/i,       exclude: /(2\.|3\.| ii\b|2\b|second)/i },
  seriea:       { include: /serie ?a/i,         exclude: /serie ?b/i },
  ligue1:       { include: /ligue ?1/i,         exclude: /ligue ?2/i },
  eredivisie:   { include: /eredivisie/i,       exclude: /(eerste|2\b)/i },
  championship: { include: /championship/i,     exclude: /(league ?1|league ?2|conference)/i },
  mls:          { include: /^mls\b|major league soccer/i, exclude: /next ?pro/i },
  eliteserien:  { include: /eliteserien/i,      exclude: /(obos|1\.? ?div|2\b)/i },
};

async function getTheOddsSportKeys() {
  const map = await afCached('ml:theOddsSportKeys', 7 * 24 * 3600 * 1000, async () => {
    try {
      const url = `https://api.the-odds-api.com/v4/sports/?apiKey=${THE_ODDS_API_KEY}`;
      const res = await fetchOddsViaProxies(url, {}, 8000);
      if (!res) return null;
      const list = await res.json().catch(() => null);
      if (!Array.isArray(list)) return null;
      const soccer = list.filter(s => (s.group || "").toLowerCase() === "soccer");
      const out = {};
      for (const [lk, pat] of Object.entries(THE_ODDS_SPORT_PATTERNS)) {
        const candidates = soccer.filter(s => pat.include.test(s.title || "") && !pat.exclude.test(s.title || ""));
        if (candidates.length >= 1) {
          out[lk] = candidates[0].key;
          if (candidates.length > 1) {
            console.warn(`[theOddsApi] ${lk} 후보 ${candidates.length}개, 첫번째 채택:`, candidates.map(c => c.title));
          }
        } else {
          console.warn(`[theOddsApi] ${lk}에 매칭되는 sport 못 찾음(the-odds-api.com 미지원이거나 패턴 재조정 필요)`);
        }
      }
      return out;
    } catch (e) { return null; }
  });
  return map || {};
}

async function fetchTheOddsEventsForLeague(leagueKey) {
  const sportKeys = await getTheOddsSportKeys();
  const sportKey = sportKeys[leagueKey];
  if (!sportKey) return [];
  const events = await afCached(`ml:theOddsEvents:${leagueKey}`, 6 * 3600 * 1000, async () => {
    try {
      const url = `https://api.the-odds-api.com/v4/sports/${sportKey}/odds?apiKey=${THE_ODDS_API_KEY}&regions=eu&markets=h2h&oddsFormat=decimal`;
      const res = await fetchOddsViaProxies(url, {}, 8000);
      if (!res) return null;
      const j = await res.json().catch(() => null);
      return Array.isArray(j) ? j : null;
    } catch (e) { return null; }
  });
  return events || [];
}

function extractAllBookmakerOddsFromTheOddsApi(leagueKey, home, away, events) {
  if (!Array.isArray(events) || !events.length) return [];
  const ev = events.find(e =>
    (isSameClubName(leagueKey, home, e.home_team) && isSameClubName(leagueKey, away, e.away_team)) ||
    (isSameClubName(leagueKey, home, e.away_team) && isSameClubName(leagueKey, away, e.home_team)));
  if (!ev) return [];
  const swapped = !isSameClubName(leagueKey, home, ev.home_team);
  const out = [];
  for (const bk of (ev.bookmakers || [])) {
    const h2h = (bk.markets || []).find(m => m.key === "h2h");
    if (!h2h || !Array.isArray(h2h.outcomes)) continue;
    let oh = null, od = null, oa = null;
    for (const o of h2h.outcomes) {
      if (typeof o.price !== "number") continue;
      if (/^draw$/i.test(o.name || "")) od = o.price;
      else if (isSameClubName(leagueKey, swapped ? away : home, o.name)) oh = o.price;
      else if (isSameClubName(leagueKey, swapped ? home : away, o.name)) oa = o.price;
    }
    if (oh == null || oa == null) continue;
    const bkName = bk.title || bk.key || "북메이커(The Odds API)";
    out.push(swapped ? { bookmaker: bkName, home: oa, draw: od, away: oh } : { bookmaker: bkName, home: oh, draw: od, away: oa });
  }
  return out;
}

async function fetchAllBookmakerOdds(leagueKey, home, away) {
  const results = [];

  // 2026-07-31 추가: BSD 1순위(팀명매칭 불필요)
  const sched = findScheduleEventId(leagueKey, home, away);
  if (sched) {
    try {
      const bsdRows = await fetchBsdBookmakerOdds(sched.id);
      for (const r of bsdRows) {
        results.push(sched.swapped
          ? { bookmaker: `BSD·${r.bookmaker}`, home: r.away, draw: r.draw, away: r.home }
          : { bookmaker: `BSD·${r.bookmaker}`, home: r.home, draw: r.draw, away: r.away });
      }
    } catch (e) { /* 다음 소스로 */ }
  }

  try {
    const evUrl = `https://api.odds-api.io/v3/events?apiKey=${ODDS_API_IO_KEY}&sport=football&status=pending`;
    const res = await fetchOddsViaProxies(evUrl, {}, 8000);
    if (res) {
      const events = await res.json().catch(() => null);
      const list = Array.isArray(events) ? events : (Array.isArray(events?.data) ? events.data : null);
      if (Array.isArray(list)) {
        const direct = list.find(ev => isSameClubName(leagueKey, home, ev.home) && isSameClubName(leagueKey, away, ev.away));
        const swapped = direct ? null : list.find(ev => isSameClubName(leagueKey, home, ev.away) && isSameClubName(leagueKey, away, ev.home));
        const match = direct || swapped;
        if (match) {
          const oddsUrl = `https://api.odds-api.io/v3/odds?apiKey=${ODDS_API_IO_KEY}&eventId=${match.id}`;
          const oddsRes = await fetchOddsViaProxies(oddsUrl, {}, 8000);
          if (oddsRes) {
            const oddsData = await oddsRes.json().catch(() => null);
            results.push(...extractAllBookmakerOddsFromOddsApiIo(leagueKey, home, away, oddsData, !!swapped));
          }
        }
      }
    }
  } catch (e) { /* 다음 소스로 */ }

  // 2026-07-31 추가: odds-api.io가 못 준 경우(주로 마이너리그) the-odds-api.com으로 보강.
  // 이미 결과가 있어도 다른 북메이커가 추가될 수 있어 항상 같이 조회(캐시가 있어 비용 적음).
  try {
    const events = await fetchTheOddsEventsForLeague(leagueKey);
    results.push(...extractAllBookmakerOddsFromTheOddsApi(leagueKey, home, away, events));
  } catch (e) { /* 무시 */ }

  return results;
}

function OddsComparisonPanel({leagueKey, home, away, modelProbs, onFairProbs}) {
  const [rows, setRows] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const load = useCallback(async () => {
    setLoading(true); setError("");
    const list = await fetchAllBookmakerOdds(leagueKey, home, away);
    setRows(list);
    if (!list.length) setError("이 경기의 배당 데이터를 찾지 못했습니다 (아직 미개장이거나 매칭 실패).");
    setLoading(false);
  }, [leagueKey, home, away]);

  const best = useMemo(() => {
    if (!rows || !rows.length) return null;
    return { home: Math.max(...rows.map(r=>r.home)), draw: Math.max(...rows.map(r=>r.draw||0)), away: Math.max(...rows.map(r=>r.away)) };
  }, [rows]);

  useEffect(() => {
    if (!best) return;
    const fair = devigOdds(best);
    if (fair && typeof onFairProbs === "function") onFairProbs(fair);
  }, [best]);

  return (
    <Card>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <div>
          <div style={{fontSize:12, fontWeight:700, color:T.text}}>📊 배당 비교 대시보드</div>
          <div style={{fontSize:10, color:T.dim, marginTop:2}}>여러 북메이커 1X2 배당을 나란히 비교합니다</div>
        </div>
        <button onClick={load} disabled={loading}
          style={{fontSize:12, color:"#fff", background: loading?T.dim:T.accent,
                  border:"none", borderRadius:8, padding:"7px 12px", cursor:loading?"default":"pointer", whiteSpace:"nowrap"}}>
          {loading ? "조회 중..." : (rows ? "🔄 새로고침" : "배당 불러오기")}
        </button>
      </div>
      {error && <div style={{fontSize:12, color:T.gold, marginTop:8}}>{error}</div>}
      {rows && rows.length > 0 && (
        <div style={{marginTop:10, overflowX:"auto"}}>
          <table style={{width:"100%", borderCollapse:"collapse", fontSize:12}}>
            <thead>
              <tr style={{color:T.muted, borderBottom:`1px solid ${T.border}`}}>
                <th style={{textAlign:"left", padding:"6px 4px"}}>북메이커</th>
                <th style={{padding:"6px 4px"}}>홈</th><th style={{padding:"6px 4px"}}>무</th><th style={{padding:"6px 4px"}}>원정</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r,i) => (
                <tr key={i} style={{borderBottom:`1px solid ${T.border}55`}}>
                  <td style={{padding:"6px 4px", color:T.text, fontWeight:600}}>{r.bookmaker}</td>
                  {["home","draw","away"].map(k => (
                    <td key={k} style={{padding:"6px 4px", textAlign:"center",
                      color: best && r[k]===best[k] ? T.green : T.text, fontWeight: best && r[k]===best[k] ? 800 : 600}}>
                      {r[k] ? r[k].toFixed(2) : "-"}{best && r[k]===best[k] ? " 👑" : ""}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
          {best && modelProbs && (() => {
            const evHome = computeEV(modelProbs.home, best.home);
            const evDraw = computeEV(modelProbs.draw, best.draw);
            const evAway = computeEV(modelProbs.away, best.away);
            return (
              <div style={{marginTop:10, paddingTop:8, borderTop:`1px dashed ${T.border}`}}>
                <div style={{fontSize:12, color:T.muted, marginBottom:6}}>최고 배당 기준 EV = 모델확률×배당 − 1</div>
                <div style={{display:"flex", gap:8}}>
                  {[{label:"홈", ev:evHome},{label:"무", ev:evDraw},{label:"원정", ev:evAway}].map(({label,ev}) => (
                    <div key={label} style={{flex:1, textAlign:"center", padding:"8px 4px", borderRadius:8,
                      background:T.surface, border:`1px solid ${ev!==null && ev>0.03 ? T.green : T.border}`}}>
                      <div style={{fontSize:10, color:T.muted}}>{label}</div>
                      <div style={{fontSize:13, fontWeight:800, marginTop:2, color: ev===null?"gray":ev>0.03?T.green:ev<-0.03?T.red:T.text}}>
                        {ev===null?"-":`${ev>=0?"+":""}${(ev*100).toFixed(1)}%`}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}
        </div>
      )}
    </Card>
  );
}
