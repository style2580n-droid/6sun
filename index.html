// API-Football 전용이라 AF 미지원 리그는 부상자만 나오고 라인업 칸은 비어있을 수 있음
// (엘리테세리엔은 AF도 ESPN도 슬러그 미확인이라 여전히 버튼 자체가 숨겨짐).
function LineupInjuryPanel({leagueKey, home, away}) {
  const [lineup, setLineup] = useState(null);
  const [injuries, setInjuries] = useState(null);
  const [loading, setLoading] = useState(false);
  const [tried, setTried] = useState(false);

  if (!AF_LEAGUE_IDS[leagueKey] && !ESPN_LEAGUE_SLUGS[leagueKey]) return null;

  const load = useCallback(async () => {
    setLoading(true); setTried(true);
    const [lu, inj] = await Promise.all([
      fetchApiFootballLineup(leagueKey, home, away),
      fetchApiFootballInjuries(leagueKey, home, away),
    ]);
    setLineup(lu); setInjuries(inj);
    setLoading(false);
  }, [leagueKey, home, away]);

  const hasLineup = lineup && (lineup.home?.startXI?.length || lineup.away?.startXI?.length);
  const hasInjuries = injuries && (injuries.home?.length || injuries.away?.length);
  const injurySourceLabel = injuries?.source || "API-FOOTBALL/ESPN";

  return (
    <Card>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <div>
          <div style={{fontSize:12, fontWeight:700, color:T.text}}>👥 확정 라인업 · 결장 정보</div>
          <div style={{fontSize:10, color:T.dim, marginTop:2}}>킥오프 1시간 전부터 라인업이 채워집니다 ({injurySourceLabel})</div>
        </div>
        <button onClick={load} disabled={loading}
          style={{fontSize:12, color:"#fff", background: loading?T.dim:T.accent,
                  border:"none", borderRadius:8, padding:"7px 12px", cursor:loading?"default":"pointer", whiteSpace:"nowrap"}}>
          {loading ? "조회 중..." : (tried ? "🔄 새로고침" : "라인업 불러오기")}
        </button>
      </div>

      {/* 2026-08-01 수정: 카드 결장위험(옐로누적/레드카드)은 여기서 뺐다 —
          "킥오프 1시간 전부터 라인업이 채워집니다"라는 문구 아래 같이 있으니
          카드 정보도 라인업처럼 시간이 지나야 나오는 것처럼 오해를 샀다
          (사용자 피드백: 과거 경기 기록으로 즉시 계산되는 데이터라 라인업
          타이밍과 무관한데 왜 묶여있냐). 이제 화면 위쪽 AbsenceSummaryPanel
          (항상 바로 보이는 곳)에서만 다룬다 — 라인업/API-Football·ESPN
          부상자만 여기(버튼 눌러야 조회되는 것들)에 남긴다. */}

      {tried && !loading && !hasLineup && !hasInjuries && (
        <div style={{fontSize:12, color:T.gold, marginTop:8}}>
          아직 확정 라인업/결장 정보가 없습니다 (킥오프 임박 전이거나 매칭 실패).
        </div>
      )}

      {hasLineup && (
        <div style={{marginTop:10, display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
          {["home","away"].map(side => (
            <div key={side}>
              <div style={{fontSize:12, fontWeight:700, color:T.muted, marginBottom:4}}>
                {side==="home"?home:away} {lineup[side]?.formation ? `(${lineup[side].formation})` : ""}
              </div>
              {(lineup[side]?.startXI||[]).map((p,i) => (
                <div key={i} style={{fontSize:12, color:T.text, padding:"2px 0"}}>
                  {p.number!=null?`${p.number} `:""}{p.name}{p.pos?` (${p.pos})`:""}
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      {hasInjuries && (
        <div style={{marginTop:12, paddingTop:8, borderTop:`1px dashed ${T.border}`}}>
          <div style={{fontSize:12, fontWeight:700, color:T.muted, marginBottom:4}}>🩹 결장(부상·징계)</div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
            {["home","away"].map(side => (
              <div key={side}>
                {(injuries[side]||[]).map((p,i) => (
                  <div key={i} style={{fontSize:12, color:T.red, padding:"2px 0"}}>{p.name} — {p.reason}</div>
                ))}
              </div>
            ))}
          </div>
        </div>
      )}
    </Card>
  );
}

// ============================================================ 예측 결과 공유 카드 (EPL 앱 이식)
// 로고가 없는 팀(승격팀 등)은 CLUB_ABBR 약어를 원형 배지로 그려서 대체한다.
function loadImageAsync(src) {
  return new Promise((resolve, reject) => {
    if (!src) { reject(new Error("no src")); return; }
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function drawAbbrBadge(ctx, abbr, cx, cy, r) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = "#182640"; ctx.fill();
  ctx.strokeStyle = "#2979ff"; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = "#e8f0fe";
  ctx.font = `bold ${Math.round(r*0.55)}px sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(abbr, cx, cy+2);
  ctx.restore();
}
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
async function generateShareImage(leagueKey, home, away, result) {
  const W = 750, H = 1000;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, "#05080f"); grad.addColorStop(1, "#0b1220");
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#2979ff"; ctx.font = "bold 26px sans-serif";
  ctx.fillText(`⚽ ${LEAGUES[leagueKey].label} 예측기`, W/2, 58);
  ctx.fillStyle = "#6b8aad"; ctx.font = "14px sans-serif";
  ctx.fillText("ELO + xG 블렌딩 · 몬테카를로 10만회", W/2, 86);

  const crestSize = 110;
  try {
    const homeImg = await loadImageAsync(CLUB_LOGOS[home]);
    ctx.drawImage(homeImg, W*0.24 - crestSize/2, 130, crestSize, crestSize);
  } catch (e) { drawAbbrBadge(ctx, clubAbbr(home), W*0.24, 130+crestSize/2, crestSize/2); }
  try {
    const awayImg = await loadImageAsync(CLUB_LOGOS[away]);
    ctx.drawImage(awayImg, W*0.76 - crestSize/2, 130, crestSize, crestSize);
  } catch (e) { drawAbbrBadge(ctx, clubAbbr(away), W*0.76, 130+crestSize/2, crestSize/2); }

  ctx.fillStyle = "#e8f0fe"; ctx.font = "bold 20px sans-serif";
  ctx.fillText(home, W*0.24, 275); ctx.fillText(away, W*0.76, 275);
  ctx.fillStyle = "#6b8aad"; ctx.font = "bold 26px sans-serif";
  ctx.fillText("VS", W/2, 195);

  const top = result.topScores?.[0];
  if (top) {
    const [hg, ag] = top.score.split("-");
    ctx.fillStyle = "#00bcd4"; ctx.font = "bold 66px sans-serif";
    ctx.fillText(`${hg} : ${ag}`, W/2, 380);
    ctx.fillStyle = "#6b8aad"; ctx.font = "14px sans-serif";
    ctx.fillText(`자체 모델 예상 스코어 · 확률 ${(top.prob*100).toFixed(1)}%`, W/2, 406);
  }

  const barX = 60, barY = 450, barW = W-120, barH = 46;
  const hw = result.homeWinProb, dw = result.drawProb, aw = result.awayWinProb;
  ctx.save(); roundRectPath(ctx, barX, barY, barW, barH, 12); ctx.clip();
  let x = barX;
  for (const seg of [{w:barW*hw, color:"#2979ff"}, {w:barW*dw, color:"#6b8aad"}, {w:barW*aw, color:"#f5a623"}]) {
    ctx.fillStyle = seg.color; ctx.fillRect(x, barY, seg.w+1, barH); x += seg.w;
  }
  ctx.restore();

  ctx.font = "bold 16px sans-serif"; ctx.fillStyle = "#fff";
  ctx.textAlign = "left"; ctx.fillText(`${(hw*100).toFixed(0)}%`, barX+12, barY+barH/2+6);
  ctx.textAlign = "right"; ctx.fillText(`${(aw*100).toFixed(0)}%`, barX+barW-12, barY+barH/2+6);
  ctx.textAlign = "center";
  if (dw > 0.08) ctx.fillText(`${(dw*100).toFixed(0)}%`, barX+barW*hw+barW*dw/2, barY+barH/2+6);

  ctx.font = "13px sans-serif"; ctx.fillStyle = "#6b8aad";
  ctx.fillText(`${home} 승  ·  무승부  ·  ${away} 승`, W/2, barY+barH+26);

  ctx.font = "17px sans-serif"; ctx.fillStyle = "#e8f0fe";
  ctx.fillText(`예상 기대득점(λ)  ${result.lambdaHome.toFixed(2)} : ${result.lambdaAway.toFixed(2)}`, W/2, 570);

  ctx.font = "12px sans-serif"; ctx.fillStyle = "#2a3f5f";
  ctx.fillText(`생성일 ${new Date().toLocaleDateString("ko-KR")} · 통계 모델 기반 예측(참고용)`, W/2, H-42);
  ctx.fillText("v1.0 · 8개리그 예측기", W/2, H-22);
  return canvas;
}

function ShareResultPanel({leagueKey, home, away, result}) {
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const handleShare = useCallback(() => {
    setBusy(true); setMsg("");
    generateShareImage(leagueKey, home, away, result).then(canvas => {
      canvas.toBlob(async (blob) => {
        if (!blob) { setBusy(false); setMsg("이미지 생성에 실패했습니다."); return; }
        const fileName = `${home}_vs_${away}_예측.png`;
        const file = (typeof File !== "undefined") ? new File([blob], fileName, {type:"image/png"}) : null;
        try {
          if (file && navigator.canShare && navigator.canShare({files:[file]})) {
            await navigator.share({ files:[file], title:`${home} vs ${away} 예측`, text:`${LEAGUES[leagueKey].label} 예측기 결과` });
            setMsg("공유 완료!");
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = fileName;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(()=>URL.revokeObjectURL(url), 5000);
            setMsg("이미지가 다운로드됐습니다.");
          }
        } catch (e) { setMsg("공유가 취소되었거나 실패했습니다."); }
        finally { setBusy(false); }
      }, "image/png");
    }).catch(() => { setBusy(false); setMsg("이미지 생성 중 오류가 발생했습니다."); });
  }, [leagueKey, home, away, result]);

  return (
    <Card style={{textAlign:"center"}}>
      <div style={{fontSize:12, fontWeight:700, color:T.text}}>🖼️ 예측 결과 공유</div>
      <div style={{fontSize:10, color:T.dim, marginTop:2, marginBottom:8}}>이미지 카드로 저장하거나 공유합니다</div>
      <button onClick={handleShare} disabled={busy}
        style={{width:"100%", padding:"12px", borderRadius:10, border:"none",
                background: busy ? T.dim : T.purple, color:"#fff", fontSize:14, fontWeight:800, cursor:busy?"default":"pointer"}}>
        {busy ? "이미지 생성 중..." : "📤 공유 카드 만들기"}
      </button>
      {msg && <div style={{fontSize:12, color:T.muted, marginTop:8}}>{msg}</div>}
    </Card>
  );
}

// getH2H/H2HCard: EPL 앱(index.html)의 getH2H/H2HCard를 이식. 이 앱엔 EPL의
// _liveResults(사용자가 직접 추적하는 실시간 결과) 개념이 없어서 그 부분은
// 빼고, 파이프라인 H2H(matches 테이블 기반, app_export_multileague.py
// build_h2h())만 쓴다 — 6개 리그 다 같은 구조라 그대로 재사용 가능.
function getH2H(teamA, teamB) {
  const key = [teamA, teamB].sort().join("|||");
  const raw = H2H[key] || [];
  const games = raw.map(g => ({ home: g.home, away: g.away, hg: g.homeGoals, ag: g.awayGoals, date: g.date || "" }))
    .sort((x, y) => (x.date < y.date ? 1 : -1)); // 최신순
  let aWin = 0, draw = 0, bWin = 0, aGF = 0, aGA = 0;
  for (const g of games) {
    const aIsHome = g.home === teamA;
    const aScore = aIsHome ? g.hg : g.ag;
    const bScore = aIsHome ? g.ag : g.hg;
    aGF += aScore; aGA += bScore;
    if (aScore > bScore) aWin++;
    else if (aScore < bScore) bWin++;
    else draw++;
  }
  return { games, aWin, draw, bWin, aGF, aGA, total: games.length };
}

// ── 팀 결장/불투명 인원을 사유별(레드·경고누적·부상)로 파싱 (EPL 앱에서 이식, 2026-07-26) ──
// TEAM_INJURIES[team].keyOut/injured 문자열("선수명 (사유)")에서 "이번 경기에
// 실제로 못 뛰는/불투명한" 선수만 사유별로 추출. 사유 텍스트는
// app_export_multileague.py의 _reason_ko()가 붙여준다(레드카드/출전정지/
// 각종 부상명/경미한 부상 등).
function parseTeamAbsences(team) {
  const inj = (typeof TEAM_INJURIES !== "undefined") ? TEAM_INJURIES[team] : null;
  const notes = inj ? [...(inj.keyOut || []), ...(inj.injured || [])] : [];
  const out = { red: [], warn: [], injury: [], doubt: [] };
  const seen = {}; // 선수명 -> 카테고리(중복 제거, 중증 우선)
  const sevRank = { red: 3, warn: 2, injury: 1, doubt: 0 };
  for (const raw of notes) {
    if (!raw || typeof raw !== "string") continue;
    const mName = raw.split("(")[0].trim();
    const reason = (raw.match(/\(([^)]*)\)/)?.[1] || "").trim();
    const R = reason;
    if (/(출전가능|복귀 ?예정|복귀\)|복귀중|회복,|선발출전|교체출전|컨디션변수|예방|출전예정)/.test(R)) continue;
    if (/경고 ?1장/.test(R) && !/누적/.test(R)) continue;
    let cat = null;
    if (/(레드카드|퇴장|출전정지|출전 ?정지|정지)/.test(R)) cat = "red";
    else if (/(경고 ?누적|누적)/.test(R)) cat = "warn";
    else if (/(대회 ?아웃|대회 ?불참|명단 ?제외|명단교체|결장|골절|파열|수술|ACL|인대|근육|햄스트링|아킬레스|건염|뇌진탕|부상)/.test(R)) {
      cat = /(불투명|미정|낮음|가능성|의심)/.test(R) ? "doubt" : "injury";
    } else if (/(불투명|미정|출전여부)/.test(R)) cat = "doubt";
    if (!cat || !mName) continue;
    if (seen[mName] && sevRank[seen[mName]] >= sevRank[cat]) continue;
    if (seen[mName]) {
      const prev = seen[mName];
      out[prev] = out[prev].filter(x => x.name !== mName);
    }
    seen[mName] = cat;
    out[cat].push({ name: mName, reason: R });
  }
  // 2026-08-01 추가: compute_card_suspensions.py가 만든 카드 결장위험도 같이
  // 반영. 레드카드 직전경기는 "red"(확정급), 옐로누적 기준도달은 "warn"으로
  // 분류 — 위 API-Football/ESPN 텍스트 파싱과 같은 카테고리 체계를 그대로 씀.
  for (const [name, info] of Object.entries(CARD_SUSPENSIONS || {})) {
    if (info.team !== team) continue;
    const cat = info.red_on_last_match ? "red" : (info.yellow_threshold_hit ? "warn" : null);
    if (!cat) continue;
    const reason = info.red_on_last_match ? "직전경기 퇴장" : `옐로카드 누적 ${info.yellow_total}장`;
    if (seen[name] && sevRank[seen[name]] >= sevRank[cat]) continue;
    if (seen[name]) {
      const prev = seen[name];
      out[prev] = out[prev].filter(x => x.name !== name);
    }
    seen[name] = cat;
    out[cat].push({ name, reason });
  }
  return out;
}

function AbsenceSummaryPanel({home, away}) {
  const [, setAbsentTick] = useState(0);
  const teams = [home, away];
  const data = teams.map(t => ({ team: t, abs: parseTeamAbsences(t) }));
  const anyAbs = data.some(d => d.abs.red.length || d.abs.warn.length || d.abs.injury.length || d.abs.doubt.length);
  const catMeta = [
    { key: "red", icon: "🟥", label: "레드/출전정지" },
    { key: "warn", icon: "🟨", label: "경고누적 결장" },
    { key: "injury", icon: "🤕", label: "부상 결장" },
    { key: "doubt", icon: "❓", label: "출전 불투명" },
  ];

  // 2026-07-29 EPL 앱에서 이식: 개인기여도(playerImpactPct) 기반 결장 체크박스.
  // 위의 API-Football 자동 결장 판정(keyOut/injured 이진, -6%/-2%p)과는 별개
  // 레이어 — 사용자가 직접 체크하면 TEAM_GROUP_GAMES 기반 개인 기여도(%)로
  // 더 정밀하게 λ가 조정된다(EPL과 동일하게 팀 합산 상한 15%p).
  const keyHome = getKeyPlayers(home);
  const keyAway = getKeyPlayers(away);

  // 2026-08-01 추가: 핵심선수 중 부상/카드결장(red·warn·injury — doubt는
  // 불확실해서 자동체크 제외)에 걸린 이름이 있으면 자동으로 체크해서,
  // 사용자가 매번 수동으로 찾아 체크할 필요 없게 한다. 경기(home vs away)당
  // 한 번만 자동체크하고, 그 이후 사용자가 직접 해제하면 그 선택을 존중
  // (재자동체크로 덮어쓰지 않음) — window.__autoCheckedMatches로 추적.
  useEffect(() => {
    if (typeof window === "undefined") return;
    if (!window.__autoCheckedMatches) window.__autoCheckedMatches = new Set();
    const matchKey = `${home}|${away}`;
    if (window.__autoCheckedMatches.has(matchKey)) return;
    window.__autoCheckedMatches.add(matchKey);

    let changed = false;
    for (const [team, keyPlayers] of [[home, keyHome], [away, keyAway]]) {
      const abs = parseTeamAbsences(team);
      const autoNames = new Set([
        ...abs.red.map(p => p.name), ...abs.warn.map(p => p.name),
        ...abs.injury.map(p => p.name),
      ]);
      for (const kp of keyPlayers) {
        if (!autoNames.has(kp.name)) continue;
        if (!window.__absentPlayers[team]) window.__absentPlayers[team] = new Set();
        if (!window.__absentPlayers[team].has(kp.name)) {
          window.__absentPlayers[team].add(kp.name);
          changed = true;
        }
      }
    }
    if (changed) setAbsentTick(t => t + 1);
  }, [home, away, keyHome.length, keyAway.length]);

  function toggleAbsent(team, name) {
    if (typeof window === "undefined") return;
    if (!window.__absentPlayers[team]) window.__absentPlayers[team] = new Set();
    const s = window.__absentPlayers[team];
    if (s.has(name)) s.delete(name); else s.add(name);
    setAbsentTick(t => t + 1);
  }
  function isAbsent(team, name) {
    if (typeof window === "undefined") return false;
    return !!(window.__absentPlayers[team] && window.__absentPlayers[team].has(name));
  }
  const absentCountH = keyHome.filter(p=>isAbsent(home,p.name)).length;
  const absentCountA = keyAway.filter(p=>isAbsent(away,p.name)).length;
  const hasImpactData = keyHome.length > 0 || keyAway.length > 0;

  if (!anyAbs && !hasImpactData) return null;
  return (
    <Card>
      {hasImpactData && (
        <div style={{marginBottom:12, padding:"8px", background:"rgba(255,255,255,0.03)", borderRadius:8, border:`1px solid ${T.border}`}}>
          <div style={{fontSize:12, color:T.dim, marginBottom:6}}>
            ⭐ 핵심선수(개인기여도) — 체크하면 결장 처리, 팀 합산 최대 -15%p로 승부예측에 즉시 반영
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"4px 12px"}}>
            <div>
              <div style={{fontSize:10, color:T.muted, fontWeight:700, marginBottom:3}}>{home}{absentCountH>0?` (결장 ${absentCountH})`:""}</div>
              {keyHome.map((p,i)=>(
                <label key={i} style={{display:"flex", alignItems:"center", gap:5, fontSize:12, padding:"2px 0", cursor:"pointer",
                  color: isAbsent(home,p.name) ? T.red : T.text, textDecoration: isAbsent(home,p.name)?"line-through":"none"}}>
                  <input type="checkbox" checked={isAbsent(home,p.name)} onChange={()=>toggleAbsent(home,p.name)} style={{cursor:"pointer"}}/>
                  {p.name} <span style={{color:T.dim, fontSize:10}}>(-{p.impactPct.toFixed(1)}%p)</span>
                </label>
              ))}
            </div>
            <div>
              <div style={{fontSize:10, color:T.muted, fontWeight:700, marginBottom:3}}>{away}{absentCountA>0?` (결장 ${absentCountA})`:""}</div>
              {keyAway.map((p,i)=>(
                <label key={i} style={{display:"flex", alignItems:"center", gap:5, fontSize:12, padding:"2px 0", cursor:"pointer",
                  color: isAbsent(away,p.name) ? T.red : T.text, textDecoration: isAbsent(away,p.name)?"line-through":"none"}}>
                  <input type="checkbox" checked={isAbsent(away,p.name)} onChange={()=>toggleAbsent(away,p.name)} style={{cursor:"pointer"}}/>
                  {p.name} <span style={{color:T.dim, fontSize:10}}>(-{p.impactPct.toFixed(1)}%p)</span>
                </label>
              ))}
            </div>
          </div>
          {(absentCountH>0||absentCountA>0) && (
            <div style={{fontSize:10, color:T.dim, marginTop:6}}>
              결장 반영폭 — {home}: -{absentWinPenaltyPct(home).toFixed(1)}%p, {away}: -{absentWinPenaltyPct(away).toFixed(1)}%p · 다시 예측하면 승부예측에 반영됩니다.
            </div>
          )}
        </div>
      )}
      {anyAbs && (<>
      <div style={{fontSize:13, fontWeight:700, color:T.text, marginBottom:2}}>🚑 결장·출전 불투명 인원</div>
      <div style={{fontSize:10, color:T.muted, marginBottom:8}}>경고누적·부상·레드카드 등으로 이 경기 결장/불투명한 주요 선수</div>
      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12}}>
        {data.map(({team, abs}) => {
          const total = abs.red.length + abs.warn.length + abs.injury.length + abs.doubt.length;
          return (
            <div key={team}>
              <div style={{fontSize:13, fontWeight:800, color:T.cyan, marginBottom:6}}>
                <TeamCrest name={team}/> {team} <span style={{color:T.muted, fontWeight:600}}>· {total}명</span>
              </div>
              {total === 0 ? (
                <div style={{fontSize:12, color:T.muted}}>보고된 결장 없음</div>
              ) : catMeta.map(cm => abs[cm.key].length ? (
                <div key={cm.key} style={{marginBottom:6}}>
                  <div style={{fontSize:10, color:T.muted, marginBottom:2}}>{cm.icon} {cm.label}</div>
                  {abs[cm.key].map((p,i) => (
                    <div key={i} style={{fontSize:12, color:T.text, lineHeight:1.5}}>
                      · <b>{p.name}</b>
                      <span style={{color:T.muted, fontSize:10}}>{p.reason ? ` (${p.reason})` : ""}</span>
                    </div>
                  ))}
                </div>
              ) : null)}
            </div>
          );
        })}
      </div>
      <div style={{fontSize:10, color:T.muted, marginTop:8, lineHeight:1.5}}>
        API-Football 부상 피드 기준(레드카드/출전정지 사유 구분은 2026-07-26부터 반영).
        승률 보정 자체는 사유와 무관하게 핵심결장 -6%p/로테이션 -2%p(팀 합산 상한 -28%p)로 계산됩니다.
      </div>
      </>)}
    </Card>
  );
}

function H2HCard({ teamA, teamB }) {
  const h = React.useMemo(() => getH2H(teamA, teamB), [teamA, teamB]);
  if (!h.total) {
    return (
      <Card>
        <div style={{fontSize:13, fontWeight:800, color:T.text, marginBottom:6}}>🤝 상대전적 (H2H)</div>
        <div style={{fontSize:13, color:T.muted, textAlign:"center", padding:"6px 0"}}>
          아직 {teamA} vs {teamB} 경기 결과가 파이프라인에 없습니다.
        </div>
      </Card>
    );
  }
  const barA = Math.round(h.aWin / h.total * 100);
  const barD = Math.round(h.draw / h.total * 100);
  const barB = 100 - barA - barD;
  return (
    <Card>
      <div style={{fontSize:13, fontWeight:800, color:T.text, marginBottom:2}}>🤝 상대전적 (H2H)</div>
      <div style={{fontSize:12, color:T.muted, marginBottom:8}}>최근 {h.total}경기 기준</div>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:4}}>
        <div style={{textAlign:"center", flex:1}}>
          <div style={{fontSize:12, color:T.muted}}>{teamA}</div>
          <div style={{fontSize:22, fontWeight:900, color:T.accent}}>{h.aWin}</div>
          <div style={{fontSize:10, color:T.dim}}>승</div>
        </div>
        <div style={{textAlign:"center", flex:0.7}}>
          <div style={{fontSize:12, color:T.muted}}>무</div>
          <div style={{fontSize:19, fontWeight:800, color:T.muted}}>{h.draw}</div>
          <div style={{fontSize:10, color:T.dim, marginTop:6}}>득실</div>
          <div style={{fontSize:12, color:T.text, fontFamily:"monospace"}}>{h.aGF} : {h.aGA}</div>
        </div>
        <div style={{textAlign:"center", flex:1}}>
          <div style={{fontSize:12, color:T.muted}}>{teamB}</div>
          <div style={{fontSize:22, fontWeight:900, color:T.gold}}>{h.bWin}</div>
          <div style={{fontSize:10, color:T.dim}}>승</div>
        </div>
      </div>
      <div style={{display:"flex", height:8, borderRadius:4, overflow:"hidden", marginTop:10, background:T.surface}}>
        <div style={{width:`${barA}%`, background:T.accent}}/>
        <div style={{width:`${barD}%`, background:T.dim}}/>
        <div style={{width:`${barB}%`, background:T.gold}}/>
      </div>
      <div style={{marginTop:12, borderTop:`1px solid ${T.border}`, paddingTop:8}}>
        <div style={{fontSize:12, color:T.muted, marginBottom:6}}>최근 맞대결</div>
        {h.games.slice(0,5).map((g,i) => (
          <div key={i} style={{display:"flex", alignItems:"center", justifyContent:"space-between",
            padding:"5px 0", borderTop: i>0?`1px solid ${T.border}`:"none", fontSize:13}}>
            <span style={{color:T.dim, fontSize:10, width:74}}>{g.date || "-"}</span>
            <span style={{flex:1, textAlign:"right"}}>{g.home}</span>
            <span style={{margin:"0 8px", fontFamily:"monospace", fontWeight:800, color:T.text}}>{g.hg}:{g.ag}</span>
            <span style={{flex:1}}>{g.away}</span>
          </div>
        ))}
      </div>
    </Card>
  );
}

function CollapsibleSection({title, defaultOpen=false, children}) {
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div style={{marginTop:12}}>
      <button onClick={() => setOpen(o => !o)}
        style={{width:"100%", display:"flex", alignItems:"center", justifyContent:"space-between",
                padding:"12px 14px", borderRadius:10, border:`1px solid ${T.border}`,
                background:T.surface, color:T.text, cursor:"pointer"}}>
        <span style={{fontSize:13, fontWeight:800}}>{title}</span>
        <span style={{fontSize:12, color:T.accent, fontWeight:700, flexShrink:0, marginLeft:8}}>
          {open ? "▲ 접기" : "▼ 펼치기"}
        </span>
      </button>
      {open && <div>{children}</div>}
    </div>
  );
}

function PredictTab({ leagueKey, pendingMatch }) {
  const teams = LEAGUES[leagueKey].teams;
  // 2026-08-02 추가: pendingMatch로 들어온 팀이 이 리그 소속이 아니어도
  // (챔스/유로파/리그간 친선전 상대) 드롭다운에서 선택 가능해야 하니
  // teams 목록에 임시로 얹는다. ELO/로고는 백엔드에서 이미 8개리그 전체
  // 병합해뒀으니 값 자체는 정상적으로 나온다.
  const selectableTeams = useMemo(() => {
    const extra = [pendingMatch?.home, pendingMatch?.away]
      .filter(t => t && !teams.includes(t));
    return extra.length ? [...teams, ...extra] : teams;
  }, [teams, pendingMatch?.home, pendingMatch?.away]);
  const [home, setHome] = useState(teams[0]);
  const [away, setAway] = useState(teams[1]);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [saved, setSaved] = useState(false);
  const [marketFairProbs, setMarketFairProbs] = useState(null); // 배당 비교 대시보드에서 최고 배당 devig 확률 수신 (모델-시장 괴리 추적용)

  useEffect(() => {
    setHome(teams[0]); setAway(teams[1]); setResult(null); setSaved(false);
    setMarketFairProbs(null);
  }, [leagueKey]);

  // 2026-07-25 추가: 일정탭 "▶"로 넘어온 경기가 있으면 팀 자동 세팅 (EPL 앱 onSelectMatch와 동일 UX).
  // ts를 deps에 둬서 같은 매치업을 연달아 눌러도(예: 결과 본 뒤 뒤로가서 같은 경기 다시 클릭) 매번 반영됨.
  // 2026-08-02 재수정: ALL_TRACKED_TEAMS 체크를 완전히 제거 — 트래킹 안
  // 하는 상대(챔스·유로파·컨퍼런스리그 등)도 막지 않는다는 방향으로
  // EPL 앱과 통일함(ScheduleTab의 ▶ 버튼도 동일하게 차단 로직 제거함).
  useEffect(() => {
    if (!pendingMatch || !pendingMatch.home || !pendingMatch.away) return;
    setHome(pendingMatch.home); setAway(pendingMatch.away); setResult(null); setSaved(false);
  }, [pendingMatch, pendingMatch?.ts]);

  const run = useCallback(() => {
    if (home === away) return;
    setLoading(true);
    setSaved(false);
    setMarketFairProbs(null);
    // 몬테카를로 10만회 시뮬레이션은 동기 연산이라 다음 프레임으로 넘겨 버튼 반응성 확보
    setTimeout(() => {
      setResult(predictMatchV2(leagueKey, home, away, 100000));
      setLoading(false);
    }, 0);
  }, [home, away]);

  const saveToHistory = useCallback(async () => {
    if (!result) return;
    try {
      const id = `${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
      const entry = {
        id, league: leagueKey, home: result.home, away: result.away,
        homeWinProb: result.homeWinProb, drawProb: result.drawProb, awayWinProb: result.awayWinProb,
        marketProbs: marketFairProbs || null,
        topScore: result.topScores[0]?.score || null,
        savedAt: new Date().toISOString(),
        settled: false, actualHome: null, actualAway: null,
      };
      const key = `wc:history:${leagueKey}`;
      const existing = await window.storage.get(key).catch(() => null);
      const list = existing && existing.value ? JSON.parse(existing.value) : [];
      list.unshift(entry);
      await window.storage.set(key, JSON.stringify(list.slice(0, 200))); // 리그당 최대 200건
      setSaved(true);
    } catch (e) {
      console.error("예측 저장 실패:", e);
    }
  }, [result, leagueKey, marketFairProbs]);

  return (
    <div>
      <Card>
        <div style={{display:"flex", gap:8, alignItems:"center"}}>
          <select value={home} onChange={e=>setHome(e.target.value)}
            style={{flex:1, minWidth:0, background:T.surface, color:T.text, border:`1px solid ${T.border}`, borderRadius:10, padding:"10px 8px", fontSize:13}}>
            {selectableTeams.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
          <span style={{color:T.muted, fontSize:12}}>vs</span>
          <select value={away} onChange={e=>setAway(e.target.value)}
            style={{flex:1, minWidth:0, background:T.surface, color:T.text, border:`1px solid ${T.border}`, borderRadius:10, padding:"10px 8px", fontSize:13}}>
            {selectableTeams.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
        <button onClick={run} disabled={home===away || loading}
          style={{width:"100%", marginTop:10, padding:"11px 0", borderRadius:10, border:"none",
                  background: (home===away || loading) ? T.dim : T.accent, color:"#fff", fontWeight:800, fontSize:14,
                  cursor: (home===away || loading) ? "default" : "pointer"}}>
          {loading ? "시뮬레이션 중... (10만회)" : "예측하기"}
        </button>
        {home===away && <div style={{color:T.red, fontSize:12, marginTop:6}}>같은 팀은 선택할 수 없습니다.</div>}
      </Card>

      {result && (
        <React.Fragment>
          <Card>
            <div style={{fontSize:12, color:T.muted, marginBottom:10, display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
              <TeamCrest name={home} size={20}/> {home} <span style={{color:T.dim}}>({clubAbbr(home)})</span> vs <TeamCrest name={away} size={20}/> {away} <span style={{color:T.dim}}>({clubAbbr(away)})</span>
              <span style={{color:T.dim}}> · Elo {Math.round(getEffectiveElo(home))} vs {Math.round(getEffectiveElo(away))}</span>
            </div>
            {result.rivalry && (
              <div style={{display:"inline-block", background:"rgba(245,166,35,0.15)", border:`1px solid ${T.gold}`,
                borderRadius:20, padding:"3px 10px", fontSize:12, color:T.gold, fontWeight:700, marginBottom:8, marginRight:6}}>
                🔥 더비/라이벌 매치 — 접전 보정 적용
              </div>
            )}
            {result.injuryApplied && (
              <div style={{display:"inline-block", background:"rgba(255,61,87,0.12)", border:`1px solid ${T.red}`,
                borderRadius:20, padding:"3px 10px", fontSize:12, color:T.red, fontWeight:700, marginBottom:8, marginRight:6}}>
                🩹 부상자 반영됨
              </div>
            )}
            {result.fatigueApplied && (
              <div style={{display:"inline-block", background:"rgba(0,188,212,0.12)", border:`1px solid ${T.cyan}`,
                borderRadius:20, padding:"3px 10px", fontSize:12, color:T.cyan, fontWeight:700, marginBottom:8}}>
                ✈️ 월드컵 여독 반영됨
              </div>
            )}
            {result.mlApplied && (
              <div style={{display:"inline-block", background:"rgba(156,39,176,0.12)", border:`1px solid ${T.purple}`,
                borderRadius:20, padding:"3px 10px", fontSize:12, color:T.purple, fontWeight:700, marginBottom:8}}>
                🤖 ML 앙상블 반영됨
              </div>
            )}
            <Bar label={`${home} 승`} value={result.homeWinProb} color={T.accent}/>
            <Bar label="무승부" value={result.drawProb} color={T.gold}/>
            <Bar label={`${away} 승`} value={result.awayWinProb} color={T.red}/>
          </Card>

          {/* 2026-08-01 이동: 예전엔 "예측 근거" 접이식 안에 있어서 펼쳐야만
              보였음(사용자 피드백: 찾기 어려움) — 결장 체크는 예측에 즉시
              영향을 주는 핵심 기능이라 확률 바로 아래 항상 보이는 위치로 뺌. */}
          <AbsenceSummaryPanel home={home} away={away}/>

          <CollapsibleSection title="🔍 예측 근거 & 상대전적">
            <ErrorBoundary>
              <TeamStyleRadarCard leagueKey={leagueKey} home={home} away={away}/>
            </ErrorBoundary>

            <PredictionExplainCard home={home} away={away} result={result}/>

            <LiveInPlayPanel home={home} away={away} lambdaHome={result.lambdaHome} lambdaAway={result.lambdaAway}/>

            {home !== away && <H2HCard teamA={home} teamB={away}/>}
          </CollapsibleSection>

          {/* 2026-08-02 추가: EPL 앱과 동일한 프로토 스타일 — 가장 유력한
              단일 스코어를 크게 강조. 아래 Top5 리스트는 그대로 유지. */}
          <Card style={{textAlign:"center"}}>
            <div style={{fontSize:12, fontWeight:700, color:T.muted, marginBottom:2}}>🎯 자체 분석 예상 스코어</div>
            <div style={{fontSize:10.5, color:T.dim, marginBottom:6}}>가장 높은 확률로 예측한 단일 스코어</div>
            {(() => {
              const top = result.topScores?.[0];
              if (!top) return null;
              const [hg, ag] = top.score.split("-").map(Number);
              const { homeWinProb:hw, drawProb:dw, awayWinProb:aw } = result;
              const maxP = Math.max(hw, dw, aw);
              const favored = hw===maxP ? "home" : aw===maxP ? "away" : "draw";
              const favoredLabel = favored==="home" ? `${home} 승` : favored==="away" ? `${away} 승` : "무승부";
              const isDrawScore = hg === ag;
              const favWinScore = favored !== "draw"
                ? result.topScores.find(s => { const [h2,a2]=s.score.split("-").map(Number); return favored==="home"?h2>a2:a2>h2; })
                : null;
              return (
                <>
                  <div style={{fontSize:36, fontWeight:900, letterSpacing:1, marginTop:4, fontFamily:"monospace"}}>
                    <span style={{color:T.accent}}>{hg}</span>
                    <span style={{color:T.muted, margin:"0 8px"}}>:</span>
                    <span style={{color:T.accent}}>{ag}</span>
                  </div>
                  <div style={{fontSize:12, color:T.muted, marginTop:4}}>
                    {home} {hg} - {ag} {away} · 확률 {(top.prob*100).toFixed(1)}%
                  </div>
                  <div style={{marginTop:10, paddingTop:8, borderTop:`1px dashed ${T.border}`, fontSize:11.5, lineHeight:1.8}}>
                    <div style={{display:"flex", justifyContent:"space-around", marginBottom:6}}>
                      <span><b style={{color:T.accent}}>{home} 승</b><br/><span style={{fontSize:14, fontWeight:800, color:T.accent}}>{(hw*100).toFixed(1)}%</span></span>
                      <span><b style={{color:T.muted}}>무승부</b><br/><span style={{fontSize:14, fontWeight:800, color:T.muted}}>{(dw*100).toFixed(1)}%</span></span>
                      <span><b style={{color:T.gold}}>{away} 승</b><br/><span style={{fontSize:14, fontWeight:800, color:T.gold}}>{(aw*100).toFixed(1)}%</span></span>
                    </div>
                    <div style={{color:T.muted}}>
                      📊 결과 예측: <b style={{color:T.text}}>{favoredLabel}</b> 우세 ({(maxP*100).toFixed(1)}%)
                      {isDrawScore && favored!=="draw" && (
                        <div style={{marginTop:4, fontSize:11}}>
                          💡 최빈 단일 스코어는 무승부지만, 전체 확률로는 {favoredLabel}가 더 높습니다
                          {favWinScore && ` (${favoredLabel} 시 유력: ${favWinScore.score} · ${(favWinScore.prob*100).toFixed(1)}%)`}
                        </div>
                      )}
                    </div>
                  </div>
                </>
              );
            })()}
          </Card>

          <Card>
            <div style={{fontSize:12, fontWeight:700, color:T.text, marginBottom:8}}>예상 스코어 Top 5</div>
            {result.topScores.map((s,i) => (
              <div key={s.score} style={{display:"flex", justifyContent:"space-between", alignItems:"center",
                padding: i===0 ? "8px 10px" : "5px 2px", marginTop: i===0 ? 0 : 2,
                borderRadius: i===0 ? 9 : 0,
                background: i===0 ? "rgba(41,121,255,0.18)" : "transparent",
                border: i===0 ? `1px solid ${T.accent}` : "none",
                borderBottom: (i>0 && i<result.topScores.length-1) ? `1px solid ${T.border}` : (i===0 ? undefined : "none")}}>
                <span style={{display:"flex", alignItems:"center", gap:6}}>
                  {i===0 && <span style={{fontSize:12}}>🎯</span>}
                  <span style={{fontSize: i===0?14:13, color: i===0?T.accent:T.text, fontWeight: i===0?900:700,

// computeStandingsTable: SCHEDULE의 각 fixture에 homeGoals/awayGoals(둘 다 유효한 숫자)가
// 있으면 "치른 경기"로 간주해서 승점·득실차를 계산한다. 아직 스코어가 없는 fixture(대부분,
// 시즌 시작 전)는 조용히 건너뛴다 — 이게 안전한 이유는, 필드가 아예 없거나 값이 이상해도
// (문자열, null 등) Number.isFinite로 걸러지기 때문에 앱이 죽거나 잘못된 승점이 찍히지 않음.
// 정렬: 승점desc → 골득실desc → 다득점desc → (전부 동률이면) ELOdesc — 실제 EPL 앱의
// calcGroupStandings와 동일한 타이브레이커 순서.
function computeStandingsTable(leagueKey) {
  const teams = LEAGUES[leagueKey].teams;
  const table = {};
  teams.forEach(t => { table[t] = { team: t, elo: getEffectiveElo(t), p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; });

  let playedCount = 0;
  for (const fixture of SCHEDULE) {
    const { home, away, homeGoals, awayGoals } = fixture || {};
    if (!table[home] || !table[away]) continue;
    if (!Number.isFinite(homeGoals) || !Number.isFinite(awayGoals)) continue; // 아직 안 치른 경기
    playedCount++;
    const h = table[home], a = table[away];
    h.p++; a.p++;
    h.gf += homeGoals; h.ga += awayGoals;
    a.gf += awayGoals; a.ga += homeGoals;
    if (homeGoals > awayGoals) { h.w++; a.l++; h.pts += 3; }
    else if (homeGoals < awayGoals) { a.w++; h.l++; a.pts += 3; }
    else { h.d++; a.d++; h.pts += 1; a.pts += 1; }
  }

  const rows = Object.values(table).map(r => ({ ...r, gd: r.gf - r.ga }));
  rows.sort((x, y) =>
    (y.pts - x.pts) || (y.gd - x.gd) || (y.gf - x.gf) || (y.elo - x.elo)
  );
  return { rows, playedCount };
}

// ============================================================ ELO 델타 진단 패널 (2026-07-31 추가)
// 감쇠계수(0.85) 튜닝 판단용. window.storage(=이 기기의 localStorage)에 쌓인 진단로그를
// 불러와서 그대로 보여준다 — 스크린샷/복사해서 다음 세션에 전달하면 그걸로 판단 가능.
function EloDeltaDiagPanel({ leagueKey }) {
  const [log, setLog] = useState(null); // null=로딩중, []=비어있음
  const [copied, setCopied] = useState(false);
  const [clearing, setClearing] = useState(false);

  useEffect(() => {
    setLog(null);
    setCopied(false);
    (async () => {
      try {
        const r = await window.storage.get(`ml:eloDeltaDiag:${leagueKey}`, false);
        setLog(r && r.value ? JSON.parse(r.value) : []);
      } catch (e) { setLog([]); }
    })();
  }, [leagueKey]);

  const liveDeltas = Object.entries(ELO_DELTA)
    .filter(([, v]) => Math.abs(v) >= 0.5)
    .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));

  const logText = log ? JSON.stringify(log, null, 1) : "";

  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(logText);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) { /* 클립보드 권한 없으면 조용히 무시 — 아래 텍스트박스에서 직접 선택 가능 */ }
  };

  const handleClear = async () => {
    setClearing(true);
    try { await window.storage.delete(`ml:eloDeltaDiag:${leagueKey}`, false); } catch (e) {}
    setLog([]);
    setClearing(false);
  };

// ============================================================ 일정 .ics 캘린더 내보내기 (EPL 앱 이식)
function icsPad2(n) { return String(n).padStart(2, "0"); }
function icsDateTime(dateStr, timeStr) {
  const [y, m, d] = dateStr.split("-");
  const [hh, mm] = (timeStr || "00:00").split(":");
  return `${y}${m}${d}T${hh}${mm}00`;
}
function icsDateTimePlusHours(dateStr, timeStr, hours) {
  const dt = new Date(`${dateStr}T${timeStr || "00:00"}:00`);
  dt.setHours(dt.getHours() + hours);
  return `${dt.getFullYear()}${icsPad2(dt.getMonth()+1)}${icsPad2(dt.getDate())}T${icsPad2(dt.getHours())}${icsPad2(dt.getMinutes())}00`;
}
function generateICS(leagueLabel, matches) {
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${icsPad2(now.getUTCMonth()+1)}${icsPad2(now.getUTCDate())}T${icsPad2(now.getUTCHours())}${icsPad2(now.getUTCMinutes())}00Z`;
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//8개리그 예측기//KO", "CALSCALE:GREGORIAN"];
  matches.forEach((g, i) => {
    if (!g.date) return;
    lines.push("BEGIN:VEVENT");
    lines.push(`UID:${leagueLabel}-${g.date}-${g.time||"00:00"}-${i}@sixleague-predictor`);
    lines.push(`DTSTAMP:${stamp}`);
    lines.push(`DTSTART:${icsDateTime(g.date, g.time)}`);
    lines.push(`DTEND:${icsDateTimePlusHours(g.date, g.time, 2)}`);
    lines.push(`SUMMARY:⚽ [${leagueLabel}] ${g.home} vs ${g.away}`);
    lines.push(`DESCRIPTION:${leagueLabel} · ${g.home} vs ${g.away}`);
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function downloadICS(filename, content) {
  const blob = new Blob([content], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

  );

// computeAccuracyMetrics: EPL 앱에서 그대로 이식 (순수 함수, history 데이터 구조가 동일해서
// 필드명 하나도 안 바꾸고 재사용 가능). 정산된(settled) 예측만으로 브라이어 스코어와
// 확신도 구간별(0-10%, 10-20%...) 실제 적중률(캘리브레이션)을 계산한다.
function computeAccuracyMetrics(entries) {
  const valid = (entries || []).filter(h => h && h.settled
    && h.actualHome != null && h.actualAway != null
    && typeof h.homeWinProb === "number" && typeof h.drawProb === "number" && typeof h.awayWinProb === "number");
  if (!valid.length) return null;

  let brierSum = 0;
  let dirHits = 0, exactHits = 0;
  const buckets = Array.from({length:10}, () => ({count:0, hits:0, confSum:0}));

  for (const h of valid) {
    const actual = h.actualHome > h.actualAway ? "home" : (h.actualHome < h.actualAway ? "away" : "draw");
    const oh = actual === "home" ? 1 : 0, od = actual === "draw" ? 1 : 0, oa = actual === "away" ? 1 : 0;
    const ph = h.homeWinProb, pd = h.drawProb, pa = h.awayWinProb;
    brierSum += (ph-oh)*(ph-oh) + (pd-od)*(pd-od) + (pa-oa)*(pa-oa);

    const predicted = (ph >= pd && ph >= pa) ? "home" : ((pa >= pd && pa >= ph) ? "away" : "draw");
    const confidence = Math.max(ph, pd, pa);
    if (predicted === actual) dirHits++;

    const [predH, predA] = h.topScore ? h.topScore.split("-").map(Number) : [null, null];
    if (predH === h.actualHome && predA === h.actualAway) exactHits++;

    const bIdx = Math.min(9, Math.max(0, Math.floor(confidence*10)));
    buckets[bIdx].count++;
    buckets[bIdx].confSum += confidence;
    if (predicted === actual) buckets[bIdx].hits++;
  }

  return {
    n: valid.length,
    brierScore: brierSum / valid.length,
    dirHitRate: dirHits / valid.length,
    exactHitRate: exactHits / valid.length,
    buckets: buckets.map((b, i) => ({
      range: `${i*10}–${(i+1)*10}%`,
      count: b.count,
      avgConfidence: b.count ? b.confSum / b.count : null,
      actualHitRate: b.count ? b.hits / b.count : null,
    })).filter(b => b.count > 0),
  };
}

// ============================================================ 모델 vs 시장배당 괴리 추적 (EPL 앱 이식)
function computeModelVsMarketBias(entries) {
  const valid = (entries || []).filter(h => h && h.settled
    && h.actualHome != null && h.actualAway != null
    && h.marketProbs && typeof h.marketProbs.home === "number"
    && typeof h.homeWinProb === "number");
  if (!valid.length) return null;

  let biasSum = 0, modelBrierSum = 0, marketBrierSum = 0, modelCloser = 0;
  for (const h of valid) {
    const actual = h.actualHome > h.actualAway ? "home" : (h.actualHome < h.actualAway ? "away" : "draw");
    const oh = actual==="home"?1:0, od = actual==="draw"?1:0, oa = actual==="away"?1:0;
    biasSum += (h.homeWinProb - h.marketProbs.home);
    const mBrier = (h.homeWinProb-oh)**2 + (h.drawProb-od)**2 + (h.awayWinProb-oa)**2;
    const mkBrier = (h.marketProbs.home-oh)**2 + (h.marketProbs.draw-od)**2 + (h.marketProbs.away-oa)**2;
    modelBrierSum += mBrier; marketBrierSum += mkBrier;
    if (mBrier < mkBrier) modelCloser++;
  }
  return {
    n: valid.length,
    avgBias: biasSum / valid.length,
    modelBrier: modelBrierSum / valid.length,
    marketBrier: marketBrierSum / valid.length,
    modelCloserRate: modelCloser / valid.length,
  };
}

function ModelVsMarketPanel({history}) {
  const bias = useMemo(() => computeModelVsMarketBias(history), [history]);
  if (!bias || bias.n < 5) {
    return (
      <Card>
        <div style={{fontSize:12, fontWeight:700, color:T.text}}>📐 모델 vs 시장배당 괴리</div>

        </div>
      </Card>
    );
  }
  const biasPct = bias.avgBias * 100;
  const biasLabel = Math.abs(biasPct) < 1.5 ? "시장과 거의 일치" : (biasPct > 0 ? "홈팀에 더 낙관적" : "원정팀에 더 낙관적(홈에 비관적)");
  const biasColor = Math.abs(biasPct) < 1.5 ? T.green : T.gold;
  return (
    <Card>
      <div style={{fontSize:12, fontWeight:700, color:T.text}}>📐 모델 vs 시장배당 괴리</div>
      <div style={{fontSize:10, color:T.dim, marginTop:2, marginBottom:8}}>정산 {bias.n}건 기준</div>
      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8}}>

          <div style={{fontSize:16, fontWeight:900, color:biasColor}}>{biasPct>=0?"+":""}{biasPct.toFixed(1)}%p</div>
          <div style={{fontSize:10, color:T.muted, marginTop:2}}>평균 편향(모델−시장)</div>

          <div style={{fontSize:10, color:T.muted, marginTop:2}}>모델이 시장보다 정확했던 비율</div>
          <div style={{fontSize:10, color:T.dim, marginTop:2}}>모델 {bias.modelBrier.toFixed(3)} · 시장 {bias.marketBrier.toFixed(3)}</div>
        </div>
      </div>
    </Card>
  );
}

// 예측을 미리 저장해야만 보이던 기존 HistoryTab과 달리, 파이프라인이 이미
// 갖고 있는 종료경기(SCHEDULE의 homeGoals/awayGoals)를 그냥 그대로 보여준다.
// MLS/엘리테세리엔처럼 이미 시즌이 진행 중인 리그는 저장 없이도 바로 여기서
// 확인 가능 — "저장했어야만 기록이 남는" 기존 흐름의 진입장벽을 없앤다.
// ⚠️ 정직하게: 이건 경기 전에 미리 건 예측이 아니라 지금 시점 모델로
// 사후 계산한 것이다(그 사이 ELO/xG가 그 경기 결과 자체를 이미 반영했을 수
// 있음) — 순수한 블라인드 사전예측 검증은 아니라서 그렇게 표기해뒀다.
function AutoResultRow({ leagueKey, game }) {
  const pred = React.useMemo(() => {
    try { return predictMatchV2(leagueKey, game.home, game.away, 3000); }
    catch (e) { return null; }
  }, [leagueKey, game.home, game.away]);

  if (!pred || !Number.isFinite(game.homeGoals) || !Number.isFinite(game.awayGoals)) return null;

  const predDir = pred.homeWinProb > pred.awayWinProb
    ? (pred.homeWinProb > pred.drawProb ? "home" : "draw")
    : (pred.awayWinProb > pred.drawProb ? "away" : "draw");
  const actualDir = game.homeGoals > game.awayGoals ? "home" : game.homeGoals < game.awayGoals ? "away" : "draw";
  const topScore = pred.topScores[0]?.score;
  const exactHit = topScore === `${game.homeGoals}-${game.awayGoals}`;
  const dirHit = predDir === actualDir;
  const badge = exactHit ? { label: "✅ 스코어 적중", color: T.green }
    : dirHit ? { label: "🔵 방향 적중", color: T.cyan }
    : { label: "❌ 미적중", color: T.red };

  return (
    <div style={{ padding: "8px 0", borderTop: `1px solid ${T.border}`, fontSize: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ color: T.dim, fontSize: 10 }}>{game.date || "-"}</span>
        <span style={{ color: badge.color, fontWeight: 700, fontSize: 12 }}>{badge.label}</span>
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 3 }}>
        <span style={{ flex: 1, display: "flex", alignItems: "center", gap: 4 }}>
          <TeamCrest name={game.home} size={16} />{game.home}
        </span>
        <span style={{ fontFamily: "monospace", fontWeight: 800, color: T.text, margin: "0 8px" }}>
          {game.homeGoals}:{game.awayGoals}
        </span>
        <span style={{ flex: 1, textAlign: "right", display: "flex", alignItems: "center", gap: 4, justifyContent: "flex-end" }}>
          {game.away}<TeamCrest name={game.away} size={16} />
        </span>
      </div>
      <div style={{ fontSize: 10, color: T.muted, marginTop: 2 }}>
        모델(사후계산): {game.home} {(pred.homeWinProb * 100).toFixed(0)}% · 무 {(pred.drawProb * 100).toFixed(0)}% · {game.away} {(pred.awayWinProb * 100).toFixed(0)}%
        {topScore ? ` · 예상 ${topScore}` : ""}
      </div>
    </div>
  );
}

// getTeamRecentForm: 실제 SCHEDULE(파이프라인 실측 종료경기)에서 해당 팀의 최근 5경기를
// 뽑아 승/무/패·득실·상대팀을 반환. EPL 앱의 RECENT_FORM처럼 별도 저장소를 새로 안 만들고
// 이미 있는 SCHEDULE을 그대로 재사용 — 8개리그 앱은 이미 파이프라인이 SCHEDULE에 실제
// 결과를 넣어주고 있어서(자동정산/자동기록카드가 쓰는 것과 동일 소스) 중복 데이터 불필요.
function getTeamRecentForm(team) {
  const rows = SCHEDULE
    .filter(g => g && (g.home === team || g.away === team) &&
      Number.isFinite(g.homeGoals) && Number.isFinite(g.awayGoals))
    .map(g => {
      const isHome = g.home === team;
      const gf = isHome ? g.homeGoals : g.awayGoals;
      const ga = isHome ? g.awayGoals : g.homeGoals;
      const opp = isHome ? g.away : g.home;
      const r = gf > ga ? "W" : gf === ga ? "D" : "L";
      return { r, gf, ga, opp, date: g.date || "" };
    })
    .sort((a, b) => b.date.localeCompare(a.date));
  return rows.slice(0, 5);
}

function RecentFormPanel({ home, away }) {
  const [open, setOpen] = useState(true);
  const hForm = getTeamRecentForm(home);
  const aForm = getTeamRecentForm(away);
  if (!hForm.length && !aForm.length) return null;

  const resultColor = (r) => r === "W" ? T.green : (r === "D" ? T.gold : T.red);
  const resultKr = (r) => r === "W" ? "승" : (r === "D" ? "무" : "패");
  const summarize = (form) => {
    if (!form.length) return null;
    let w = 0, d = 0, l = 0, gf = 0, ga = 0;
    form.forEach(m => { if (m.r === "W") w++; else if (m.r === "D") d++; else l++; gf += m.gf; ga += m.ga; });
    return { w, d, l, gf, ga, pts: w * 3 + d, record: `${w}승 ${d}무 ${l}패` };
  };
  const hs = summarize(hForm), as = summarize(aForm);

  const TeamColumn = ({ team, form, summary }) => (
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ fontSize: 13, fontWeight: 800, color: T.text, marginBottom: 4, display: "flex", alignItems: "center", gap: 5 }}>
        <TeamCrest name={team} size={18} /> {team}
      </div>
      {form.length ? (
        <>
          <div style={{ display: "flex", gap: 4, marginBottom: 6 }}>
            {form.map((m, i) => (
              <div key={i} title={`${resultKr(m.r)} ${m.gf}-${m.ga} vs ${m.opp}`}
                style={{ width: 20, height: 20, borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center",
                  background: T.surface, border: `1px solid ${resultColor(m.r)}`, color: resultColor(m.r), fontSize: 10, fontWeight: 800 }}>
                {resultKr(m.r)}
              </div>
            ))}
          </div>
          <div style={{ fontSize: 10, color: T.muted }}>
            <span style={{ color: T.text, fontWeight: 700 }}>{summary.record}</span>
            <span style={{ marginLeft: 6 }}>· {summary.gf}득 {summary.ga}실 · 폼승점 {summary.pts}/15</span>
          </div>
        </>
      ) : (
        <div style={{ fontSize: 12, color: T.dim, padding: "6px 0" }}>최근 경기 데이터 없음</div>
      )}
    </div>
  );

  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: open ? 8 : 0 }}>
        <div style={{ fontSize: 13, fontWeight: 800, color: T.text }}>📋 최근 5경기 폼 (파이프라인 실측)</div>
        <button onClick={() => setOpen(v => !v)}
          style={{ padding: "4px 10px", borderRadius: 7, border: `1px solid ${T.border}`, background: "transparent", color: T.muted, fontSize: 12, cursor: "pointer" }}>
          {open ? "접기" : "펼치기"}
        </button>
      </div>
      {open && (
        <div style={{ display: "flex", gap: 14 }}>
          <TeamColumn team={home} form={hForm} summary={hs} />
          <TeamColumn team={away} form={aForm} summary={as} />
        </div>
      )}
    </Card>
  );
}
