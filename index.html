function HistoryTab({ leagueKey }) {
  const [history, setHistory] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [settleInputs, setSettleInputs] = useState({}); // id -> {h,a}

  const storageKey = `wc:history:${leagueKey}`;

  const load = useCallback(async () => {
    try {
      const saved = await window.storage.get(storageKey);
      setHistory(saved && saved.value ? JSON.parse(saved.value) : []);
    } catch (e) {
      setHistory([]);
    }
    setLoaded(true);
  }, [storageKey]);

  useEffect(() => { setLoaded(false); load(); }, [leagueKey, load]);

  const persist = async (list) => {
    setHistory(list);
    try { await window.storage.set(storageKey, JSON.stringify(list)); } catch (e) {}
  };

  // 2026-07-25 추가: 저장된 예측 중 아직 정산 안 된 것들을, 수동입력 없이
  // 파이프라인 SCHEDULE의 실제 스코어(homeGoals/awayGoals)와 자동 대조한다.
  // 매치 못 하면(아직 안 끝났거나 팀명 매칭 실패) 그대로 두고 기존처럼
  // 수동입력 UI를 폴백으로 남겨둔다.
  useEffect(() => {
    if (!loaded || !history.length) return;
    const unsettled = history.filter(h => !h.settled);
    if (!unsettled.length) return;
    let changed = false;
    const list = history.map(entry => {
      if (entry.settled) return entry;
      const match = SCHEDULE.find(g => g && g.home === entry.home && g.away === entry.away
        && Number.isFinite(g.homeGoals) && Number.isFinite(g.awayGoals));
      if (!match) return entry;
      changed = true;
      return { ...entry, settled: true, actualHome: match.homeGoals, actualAway: match.awayGoals,
        settledBy: "auto" };
    });
    if (changed) persist(list);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, history.length, leagueKey]);

  const settle = async (id) => {
    const input = settleInputs[id];
    if (!input || input.h === "" || input.a === "") return;
    const h = Number(input.h), a = Number(input.a);
    if (!Number.isFinite(h) || !Number.isFinite(a) || h < 0 || a < 0) return;
    const list = history.map(entry => entry.id === id
      ? { ...entry, settled: true, actualHome: h, actualAway: a }
      : entry);
    await persist(list);
  };

  const removeEntry = async (id) => {
    await persist(history.filter(entry => entry.id !== id));
  };

  const clearAll = async () => {
    await persist([]);
  };

  if (!loaded) return <Card><div style={{textAlign:"center", color:T.muted, fontSize:13}}>불러오는 중...</div></Card>;

  const settled = history.filter(h => h.settled);
  const dirHits = settled.filter(h => {
    const predicted = h.homeWinProb > h.awayWinProb ? (h.homeWinProb > h.drawProb ? "home" : "draw") : (h.awayWinProb > h.drawProb ? "away" : "draw");
    const actual = h.actualHome > h.actualAway ? "home" : (h.actualHome < h.actualAway ? "away" : "draw");
    return predicted === actual;
  }).length;
  const exactHits = settled.filter(h => h.topScore === `${h.actualHome}-${h.actualAway}`).length;

  return (
    <div>
      <Card>
        <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:6, textAlign:"center"}}>
          <div><div style={{fontSize:16, fontWeight:800, color:T.text}}>{history.length}</div><div style={{fontSize:10, color:T.muted}}>저장</div></div>
          <div><div style={{fontSize:16, fontWeight:800, color:T.muted}}>{history.length - settled.length}</div><div style={{fontSize:10, color:T.muted}}>미정산</div></div>
          <div><div style={{fontSize:16, fontWeight:800, color:T.cyan}}>{dirHits}/{settled.length}</div><div style={{fontSize:10, color:T.muted}}>방향적중</div></div>
          <div><div style={{fontSize:16, fontWeight:800, color:T.green}}>{exactHits}/{settled.length}</div><div style={{fontSize:10, color:T.muted}}>스코어적중</div></div>
        </div>
        {settled.length > 0 && (
          <div style={{marginTop:8, padding:"6px 0", borderTop:`1px solid ${T.border}`, textAlign:"center"}}>
            <span style={{fontSize:12, color:T.muted}}>방향 적중률 </span>
            <span style={{fontSize:14, fontWeight:800, color:T.accent}}>{(dirHits/settled.length*100).toFixed(0)}%</span>
          </div>
        )}
      </Card>

      <AccuracyPanel history={history}/>
      <ModelVsMarketPanel history={history}/>
      <AutoRecentResultsCard leagueKey={leagueKey}/>

      {history.length === 0 ? (
        <Card>
          <div style={{textAlign:"center", padding:"16px 8px", color:T.muted, fontSize:13}}>
            아직 저장된 예측이 없습니다. 예측 탭에서 "이 예측 기록에 저장"을 눌러보세요.
          </div>
        </Card>
      ) : (
        <React.Fragment>
          {history.map(h => (
            <Card key={h.id} style={{marginBottom:8}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6}}>
                <span style={{fontSize:13, color:T.text, fontWeight:700, display:"flex", alignItems:"center", gap:6}}>
                  <TeamCrest name={h.home} size={20}/> {h.home} vs {h.away} <TeamCrest name={h.away} size={20}/>
                </span>
                <button onClick={()=>removeEntry(h.id)} style={{background:"none", border:"none", color:T.dim, fontSize:12, cursor:"pointer"}}>삭제</button>
              </div>
              <div style={{fontSize:12, color:T.muted, marginBottom:6}}>
                예측: {h.home} {(h.homeWinProb*100).toFixed(0)}% · 무 {(h.drawProb*100).toFixed(0)}% · {h.away} {(h.awayWinProb*100).toFixed(0)}%
                {h.topScore && ` · 예상 ${h.topScore}`}
              </div>
              {h.settled ? (
                <div style={{fontSize:12, color:T.green, fontWeight:700}}>
                  ✅ 실제 결과: {h.actualHome}-{h.actualAway}
                </div>
              ) : (
                <div style={{display:"flex", gap:6, alignItems:"center"}}>
                  <input type="number" min="0" placeholder="홈" value={settleInputs[h.id]?.h ?? ""}
                    onChange={e => setSettleInputs(s => ({ ...s, [h.id]: { ...s[h.id], h: e.target.value } }))}
                    style={{width:50, background:T.surface, border:`1px solid ${T.border}`, color:T.text, borderRadius:6, padding:"5px 6px", fontSize:12}}/>
                  <span style={{color:T.muted}}>:</span>
                  <input type="number" min="0" placeholder="원정" value={settleInputs[h.id]?.a ?? ""}
                    onChange={e => setSettleInputs(s => ({ ...s, [h.id]: { ...s[h.id], a: e.target.value } }))}
                    style={{width:50, background:T.surface, border:`1px solid ${T.border}`, color:T.text, borderRadius:6, padding:"5px 6px", fontSize:12}}/>
                  <button onClick={()=>settle(h.id)}
                    style={{flex:1, padding:"6px 0", borderRadius:6, border:"none", background:T.accent, color:"#fff", fontSize:12, fontWeight:700, cursor:"pointer"}}>
                    결과 입력해서 정산
                  </button>
                </div>
              )}
            </Card>
          ))}
          <button onClick={clearAll}
            style={{width:"100%", padding:"9px 0", borderRadius:10, border:`1px solid ${T.border}`, background:"transparent", color:T.dim, fontSize:12, cursor:"pointer"}}>
            전체 기록 삭제
          </button>
        </React.Fragment>
      )}
    </div>
  );
}

// TransfersPanel: EPL 앱(index.html)의 TransfersPanel과 동일 구조/스타일로 이식.
// { player, from/to, date } 필드 그대로 사용 — app_export_multileague.py의
// build_transfers()가 이 형식으로 만들어준다.
function TransfersPanel({ team }) {
  const t = TRANSFERS[team];
  const inList = t?.in || [];
  const outList = t?.out || [];
  if (!inList.length && !outList.length) return null;

  const fmtDate = d => {
    if (!d) return "";
    try { return new Date(d).toLocaleDateString("ko-KR", {year:"2-digit", month:"2-digit", day:"2-digit"}); }
    catch { return d; }
  };

  return (
    <Card>
      <div style={{fontSize:13, fontWeight:800, color:T.text, marginBottom:8}}>🔄 최근 이적</div>
      {inList.length > 0 && (
        <div style={{marginBottom: outList.length ? 12 : 0}}>
          <div style={{fontSize:12, fontWeight:700, color:T.green, marginBottom:6}}>⬇ 영입</div>
          <div style={{display:"flex", flexDirection:"column", gap:5}}>
            {inList.map((tr, i) => (
              <div key={i} style={{fontSize:13, color:T.text}}>
                <b>{tr.player}</b>
                <span style={{color:T.muted}}> ← {tr.from}</span>
                {tr.date && <span style={{color:T.dim, fontSize:10}}> ({fmtDate(tr.date)})</span>}
              </div>
            ))}
          </div>
        </div>
      )}
      {outList.length > 0 && (
        <div>
          <div style={{fontSize:12, fontWeight:700, color:T.red, marginBottom:6}}>⬆ 이탈</div>
          <div style={{display:"flex", flexDirection:"column", gap:5}}>
            {outList.map((tr, i) => (
              <div key={i} style={{fontSize:13, color:T.text}}>
                <b>{tr.player}</b>
                <span style={{color:T.muted}}> → {tr.to}</span>
                {tr.date && <span style={{color:T.dim, fontSize:10}}> ({fmtDate(tr.date)})</span>}
              </div>
            ))}
          </div>
        </div>
      )}
    </Card>
  );
}

// LeaderboardTab: EPL 앱의 "⚽ 시즌 기록" 탭에서 실제로 작동하는 부분(득점왕/
// 도움왕)만 6개 리그로 포팅한 것. EPL 쪽엔 GK 선방·카드 등 자리도 있지만
// 실제로는 빈 값이라(2026-07-18 확인) 여기선 아예 안 만들었다 — 없는 자리를
// 만들어봤자 "데이터 없음"만 반복해서 보여주는 셈이라 사용자 입장에서 의미 없음.
function LeaderboardTab({ leagueKey }) {
  const lg = LEAGUES[leagueKey];
  const [metric, setMetric] = useState("scorers");

  // 2026-08-02 수정: 11개 카테고리를 3개(득점왕/도움왕/선방왕)로 줄였다가,
  // 출전경기/출전시간은 다시 복원 — "팀 합계 비교"로는 의미 없다는 판단은
  // 그대로지만(스쿼드 인원 많은 팀이 그냥 유리해지는 함정, 그래서
  // LeaderboardStatsCompareCard엔 안 넣음), "개인별 순위"로는 여전히
  // 유효하다는 피드백 반영 — 스쿼드 내에서 누가 꾸준히 기회를 받는
  // 선수인지(기회창출)를 1인 단위로 보여주는 건 팀 합계와 다른 정보라서.
  // 나머지(헤더골/페널티골/프리킥골/슈팅/유효슈팅/키패스/드리블/태클/
  // 인터셉트/클리어링/경고/퇴장)는 여전히 PredictTab의 팀 대 팀 비교로만.
  const METRICS = [
    {id:"scorers", label:"⚽ 득점왕"}, {id:"assists", label:"🎯 도움왕"},
    {id:"saves", label:"🧤 선방왕"},
    {id:"appearances", label:"📅 출전경기"}, {id:"minutesPlayed", label:"⏱ 출전시간"},
  ];
  const curLabel = METRICS.find(m => m.id === metric)?.label || metric;

  const rows = useMemo(() => {
    const src = LEADERBOARD[metric] || {};
    return Object.entries(src)
      .map(([key, val]) => {
        const idx = key.lastIndexOf("|");
        const name = idx >= 0 ? key.slice(0, idx) : key;
        const team = idx >= 0 ? key.slice(idx + 1) : "";
        return { name, team, val };
      })
      .sort((a, b) => b.val - a.val)
      .slice(0, 20);
  }, [metric]);

  const hasAny = Object.keys(LEADERBOARD.scorers || {}).length > 0 ||
                 Object.keys(LEADERBOARD.assists || {}).length > 0;

  if (!hasAny) {
    return (
      <Card>
        <div style={{textAlign:"center", padding:"24px 8px"}}>
          <div style={{fontSize:28, marginBottom:8}}>⚽</div>
          <div style={{fontSize:13, color:T.text, fontWeight:700, marginBottom:6}}>
            {lg.label} 시즌 기록 데이터가 아직 없습니다
          </div>
          <div style={{fontSize:12, color:T.muted, lineHeight:1.6}}>
            2026-27 시즌이 아직 개막 전이라(8월 예정) 종료된 경기가 없습니다.
            시즌이 시작되고 경기가 끝날 때마다 <code style={{color:T.cyan}}>collect_goalscorers.py</code>가
            자동으로 득점자·도움 기록을 쌓으면 여기 자동으로 표시됩니다.
          </div>
        </div>
      </Card>
    );
  }

  return (
    <div>
      <Card>
        <div style={{display:"flex", gap:6, overflowX:"auto", paddingBottom:2}}>
          {METRICS.map(m => (
            <button key={m.id} onClick={() => setMetric(m.id)}
              style={{
                flexShrink:0, padding:"8px 12px", borderRadius:8, border:`1px solid ${T.border}`,
                background: metric === m.id ? T.accent : T.surface,
                color: metric === m.id ? "#fff" : T.text,
                fontSize:13, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap",
              }}>
              {m.label}
            </button>
          ))}
        </div>
      </Card>
      {leagueKey === "mls" && metric === "assists" && (
        <Card style={{marginTop:10}}>
          <div style={{fontSize:12, color:T.muted, lineHeight:1.6}}>
            ⚠️ MLS는 리그 고유 규정으로 <b style={{color:T.text}}>"세컨더리 어시스트"</b>(도움으로
            이어진 패스의 직전 패스도 도움 인정)를 공식 집계에 포함하는데, 이 앱의 데이터 소스는
            골당 도움 1명만 기록해서 이 부분이 반영되지 않습니다. 그래서 이 순위가 mlssoccer.com
            공식 도움왕 순위보다 낮게 나올 수 있어요(예: 2026-07 기준 실제 1위와 최대 4개 차이
            확인됨). 다른 리그는 이 규정이 없어서 영향 없습니다.
          </div>
        </Card>
      )}
      <Card>
        {rows.length === 0 ? (
          <div style={{fontSize:13, color:T.muted, textAlign:"center", padding:"12px 0"}}>
            {curLabel} 기록이 아직 없습니다.
          </div>
        ) : (
          <div style={{display:"flex", flexDirection:"column", gap:2}}>
            {rows.map((r, i) => (
              <div key={i} style={{
                display:"flex", alignItems:"center", gap:10, padding:"9px 4px",
                borderTop: i > 0 ? `1px solid ${T.border}` : "none",
              }}>
                <div style={{
                  width:22, textAlign:"center", fontSize:13, fontWeight:800,
                  color: i < 3 ? T.gold : T.dim,
                }}>{i + 1}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13, color:T.text, fontWeight:700}}>{r.name}</div>
                  {r.team && <div style={{fontSize:12, color:T.muted}}>{r.team}</div>}
                </div>
                <div style={{fontSize:16, fontWeight:900, color:T.accent}}>{r.val}</div>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

function SquadTab({ leagueKey }) {
  const lg = LEAGUES[leagueKey];
  const teams = lg.teams;
  const [team, setTeam] = useState(teams[0]);

  useEffect(() => { setTeam(teams[0]); }, [leagueKey]);

  const squad = SQUADS[team];
  const xg = TEAM_XG[team];
  const xgValid = xg && Number.isFinite(xg.xG) && Number.isFinite(xg.xGA);
  const elo = getEffectiveElo(team);

  const POS_LABELS = [
    { key: "gk", label: "GK", color: T.amber || T.cyan },
    { key: "df", label: "DF", color: T.cyan },
    { key: "mf", label: "MF", color: T.green },
    { key: "fw", label: "FW", color: T.red },
  ];

  return (
    <div>
      <Card>
        <select value={team} onChange={e => setTeam(e.target.value)}
          style={{width:"100%", padding:"9px 10px", borderRadius:8, border:`1px solid ${T.border}`,
                  background:T.surface, color:T.text, fontSize:13, fontWeight:700}}>
          {teams.map(t => <option key={t} value={t}>{t}</option>)}
        </select>
      </Card>

      {!squad ? (
        <Card>
          <div style={{textAlign:"center", padding:"20px 8px"}}>
            <div style={{fontSize:28, marginBottom:8}}>👥</div>
            <div style={{fontSize:13, color:T.text, fontWeight:700, marginBottom:6}}>
              {team} 스쿼드가 아직 연동되지 않았습니다
            </div>
            <div style={{fontSize:12, color:T.muted, lineHeight:1.6}}>
              epl-management 파이프라인이 <code style={{color:T.cyan}}>reports/app_data_multileague.js</code>를
              통해 <code style={{color:T.cyan}}>window.PIPELINE_DATA_{leagueKey.toUpperCase()}.squads</code>를
              채워주면 이 탭에 실제 선수단이 자동으로 표시됩니다.
            </div>
          </div>
        </Card>
      ) : (
        <>
          <Card>
            <div style={{display:"flex", alignItems:"center", justifyContent:"space-between"}}>
              <div style={{display:"flex", alignItems:"center", gap:10}}>
                <TeamCrest name={team} size={38}/>
                <div>
                  <div style={{fontSize:16, fontWeight:800, color:T.text}}>{team}</div>
                  <div style={{fontSize:12, color:T.muted}}>
                    {lg.label} · 선수 {squad.all.length}명{squad.coach && ` · 감독 ${squad.coach}`}
                  </div>
                </div>
              </div>
            </div>
            <div style={{display:"flex", gap:14, marginTop:12, fontSize:12}}>
              {elo != null && <div><span style={{color:T.muted}}>ELO </span><b style={{color:T.cyan}}>{Math.round(elo)}</b></div>}
              {xgValid && <div><span style={{color:T.muted}}>xG </span><b>{xg.xG.toFixed(2)}</b></div>}
              {xgValid && <div><span style={{color:T.muted}}>xGA </span><b>{xg.xGA.toFixed(2)}</b></div>}
            </div>
            {!xgValid && (
              <div style={{fontSize:12, color:T.dim, marginTop:8}}>
                ⚠️ xG 기록 없음 — 24-25/25-26 시즌 상위리그 경험이 없는 신규 승격팀일 수 있습니다.
              </div>
            )}
          </Card>

          {(() => {
            const inj = TEAM_INJURIES[team];
            const fat = TEAM_FATIGUE[team];
            const hasInj = inj && ((inj.keyOut && inj.keyOut.length) || (inj.injured && inj.injured.length));
            const hasFat = fat && Number.isFinite(fat.fatigueScore) && fat.fatigueScore > 0;
            if (!hasInj && !hasFat) return (
              <Card>
                <div style={{fontSize:12, color:T.dim}}>
                  🩹 부상자 · ✈️ 월드컵 여독 데이터 아직 없음 — 연동되면 여기 자동 표시됩니다.
                </div>
              </Card>
            );
            return (
              <Card>
                {hasInj && (
                  <div style={{marginBottom: hasFat ? 10 : 0}}>
                    <div style={{fontSize:12, fontWeight:700, color:T.red, marginBottom:4}}>🩹 부상자</div>
                    {inj.keyOut && inj.keyOut.length > 0 && (
                      <div style={{fontSize:12, color:T.text, marginBottom:2}}>핵심 결장: {inj.keyOut.join(", ")}</div>
                    )}
                    {inj.injured && inj.injured.length > 0 && (
                      <div style={{fontSize:12, color:T.muted}}>로테이션: {inj.injured.join(", ")}</div>
                    )}
                  </div>
                )}
                {hasFat && (
                  <div>
                    <div style={{fontSize:12, fontWeight:700, color:T.cyan, marginBottom:4}}>✈️ 월드컵 여독</div>
                    <div style={{fontSize:12, color:T.text}}>피로도 점수 {(fat.fatigueScore*100).toFixed(0)}%</div>
                  </div>
                )}
              </Card>
            );
          })()}

          <TransfersPanel team={team}/>

          {squad.hasPositions ? (
            <Card>
              <div style={{fontSize:12, color:T.muted, marginBottom:10}}>
                포지션은 BSD 데이터 기준 자동 분류입니다 — 세부 표기가 애매한 선수는 MF로 잡힐 수 있습니다.
              </div>
              {POS_LABELS.map(({key, label, color}) => {
                const names = squad[key] || [];
                if (!names.length) return null;
                return (
                  <div key={key} style={{marginBottom:12}}>
                    <div style={{fontSize:12, fontWeight:700, color, marginBottom:6}}>{label} · {names.length}명</div>
                    <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
                      {names.map((p, i) => (
                        <span key={i} style={{fontSize:13, color:T.text, background:T.surface,
                          border:`1px solid ${T.border}`, borderRadius:14, padding:"5px 10px"}}>
                          {p}
                        </span>
                      ))}
                    </div>
                  </div>
                );
              })}
            </Card>
          ) : (
            <Card>
              <div style={{fontSize:12, color:T.muted, marginBottom:10}}>
                ⚠️ 포지션 정보 없음(football-data.org 폴백 경로) — 전체 명단만 표시합니다.
              </div>
              <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
                {squad.all.map((p, i) => (
                  <span key={i} style={{fontSize:13, color:T.text, background:T.surface,
                    border:`1px solid ${T.border}`, borderRadius:14, padding:"5px 10px"}}>
                    {p}
                  </span>
                ))}
              </div>
            </Card>
          )}
        </>
      )}
    </div>
  );
}

// 2026-08-02 수정: 10개 탭이 아무 묶음 없이 한 줄에 나열돼있어서 "한눈에 안
// 들어온다"는 피드백. 탭 자체는 하나도 안 지우고(기능 축소 아님), 성격이
//비슷한 것끼리 붙여서 4묶음으로 재배열만 함: [예측·일정](실전 액션) →
// [리그순위·레이팅·시즌전망](팀 전력 파악) → [팀명단·스쿼드](팀 정보) →
// [시즌기록·기록·설정](부가 기능). TABS_GROUPED로 렌더링하되 그룹 사이에만
// 여백을 살짝 더 줘서(gap 6→14) 스캔하기 쉽게 함 — id/label/동작은 전부 동일.
const TABS = [
  { id:"predict", label:"🔮 예측" },
  { id:"standings", label:"리그순위" },
  { id:"outlook", label:"🔮 시즌전망" },
  { id:"teams", label:"팀 명단" },
  { id:"ranking", label:"레이팅" },
  { id:"schedule", label:"📅 일정" },
  { id:"squads", label:"👥 스쿼드" },
  { id:"leaderboard", label:"⚽ 시즌기록" },
  { id:"history", label:"📝 기록" },
  { id:"settings", label:"⚙️ 설정" },
];
// 2026-08-02 전면 개편: 사용자가 직접 제안한 구조 그대로 적용.
// - 예측/일정: 가장 크게, 별도 줄(가장 많이 누르는 버튼)
// - 리그 정보(순위·레이팅·시즌전망) / 팀 정보(팀명단·스쿼드) / 기록(시즌기록·기록)
//   을 각각 카드로 묶어서 성격별로 분리
// - 설정은 항상 맨 아래, 구분선 넣어서 분리
const NAV_GROUPS = [
  { title: "📊 리그 정보", ids: ["standings", "ranking", "outlook"] },
  { title: "👥 팀 정보", ids: ["teams", "squads"] },
  { title: "📝 기록", ids: ["leaderboard", "history"] },
];

function App() {
  const [leagueKey, setLeagueKey] = useState("laliga");
  const [leagueVersion, setLeagueVersion] = useState(0);
  const [tab, setTab] = useState("predict");
  // pendingMatch: 일정탭에서 "▶" 눌러서 예측탭으로 넘길 때 쓰는 임시 상태.
  // EPL 앱의 onSelectMatch와 동일 패턴 — 8개리그 앱엔 이게 없어서 사용자가 예측탭에서
  // 매번 드롭다운으로 직접 팀을 골라야 했음(2026-07-25 확인, 추가).
  const [pendingMatch, setPendingMatch] = useState(null);
  const [ready, setReady] = useState(false);
  const [pipelineStatus, setPipelineStatus] = useState(null); // null=확인중, true=연결됨, false=미연결
  const [favorites, setFavorites] = useState([]); // 현재 리그의 즐겨찾기 팀 목록
  const [notifyEnabled, setNotifyEnabled] = useState(false);
  const notifiedRef = useRef(new Set()); // "홈_원정_날짜_시각_30" 같은 키로 중복 알림 방지
  const [themeMode, setThemeMode] = useState("dark");
  const [themeTick, setThemeTick] = useState(0); // 시스템 모드일 때 OS 설정 변경 감지용 강제 리렌더

  useEffect(() => {
    (async () => {
      let mode = "dark";
      try {
        const r = await window.storage.get("wc:themeMode", false);
        if (r?.value === "light" || r?.value === "dark" || r?.value === "system") mode = r.value;
      } catch (e) {}
      applyTheme(mode);
      setThemeMode(mode);
    })();
  }, []);

  // 시스템 모드일 때 OS 다크/라이트 설정이 바뀌면 실시간 반영
  useEffect(() => {
    if (themeMode !== "system" || typeof window === "undefined" || !window.matchMedia) return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const handler = () => { applyTheme("system"); setThemeTick(v => v + 1); };
    try { mq.addEventListener("change", handler); } catch (e) { mq.addListener && mq.addListener(handler); }
    return () => { try { mq.removeEventListener("change", handler); } catch (e) { mq.removeListener && mq.removeListener(handler); } };
  }, [themeMode]);

  const changeTheme = useCallback((mode) => {
    applyTheme(mode);
    setThemeMode(mode);
    window.storage.set("wc:themeMode", mode, false).catch(() => {});
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const saved = await window.storage.get("wc:notifyEnabled", false);
        setNotifyEnabled(saved && saved.value === "1");
      } catch (e) {}
    })();
  }, []);

  const toggleNotify = useCallback(async (checked) => {
    if (checked && typeof Notification !== "undefined" && Notification.permission === "default") {
      try { await Notification.requestPermission(); } catch (e) {}
    }
    setNotifyEnabled(checked);
    window.storage.set("wc:notifyEnabled", checked ? "1" : "0").catch(() => {});
  }, []);

  // 킥오프 알림 — 현재 리그의 SCHEDULE + favorites만 대상으로 30초마다 확인한다.
  // (이 앱은 리그를 전환하면 그 리그 데이터만 메모리에 있으므로, 지금 열어둔 리그
  // 탭의 즐겨찾기 경기만 알림 대상이 됨 — EPL 앱과 동일하게 "이 탭이 열려있는 동안만" 동작)
  useEffect(() => {
    if (!notifyEnabled) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;

    const check = () => {
      const now = Date.now();
      for (const g of SCHEDULE) {
        if (!favorites.includes(g.home) && !favorites.includes(g.away)) continue;
        const kickoff = getKickoffDate(g);
        if (!kickoff) continue;
        const minsLeft = (kickoff.getTime() - now) / 60000;
        for (const threshold of [30, 10]) {
          const key = `${g.home}_${g.away}_${g.date}_${g.time}_${threshold}`;
          if (minsLeft <= threshold && minsLeft > threshold - 1 && !notifiedRef.current.has(key)) {
            notifiedRef.current.add(key);
            try {
              new Notification(`⚽ ${threshold}분 후 킥오프`, { body: `${g.home} vs ${g.away}` });
            } catch (e) {}
          }
        }
      }
    };
    check();
    const timer = setInterval(check, 30000);
    return () => clearInterval(timer);
  }, [notifyEnabled, favorites, leagueVersion]);

  // 부상자 변경 알림 (EPL 앱 이식) — 리그 전환/새로고침 시 즐겨찾기 팀의 TEAM_INJURIES를
  // 직전 방문 스냅샷과 비교해서 새로 추가된 항목이 있으면 알림.
  useEffect(() => {
    if (!notifyEnabled || !favorites.length) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    (async () => {
      const snapKey = `wc:injurySnapshot:${leagueKey}`;
      let snapshot = {};
      try {
        const r = await window.storage.get(snapKey);
        if (r && r.value) snapshot = JSON.parse(r.value);
      } catch (e) {}
      const nextSnapshot = { ...snapshot };
      for (const team of favorites) {
        const inj = TEAM_INJURIES[team];
        const current = inj ? [...(inj.keyOut||[]).map(n=>`핵심:${n}`), ...(inj.injured||[]).map(n=>`로테이션:${n}`)] : [];
        const prev = snapshot[team] || [];
        const newItems = current.filter(x => !prev.includes(x));
        if (prev.length > 0 && newItems.length > 0) {
          try {
            new Notification(`🩹 ${team} 부상자 소식 업데이트`, { body: newItems.slice(0,3).join(" · ") });
          } catch (e) {}
        }
        nextSnapshot[team] = current;
      }
      window.storage.set(snapKey, JSON.stringify(nextSnapshot)).catch(() => {});
    })();
  }, [notifyEnabled, favorites, leagueVersion, leagueKey]);

  // 이적 변경 알림 (2026-07-16 추가, EPL 앱엔 없던 기능 — 이 앱은 TRANSFERS가
  // 팀당 최근 20건 누적이라 "새로 생긴 항목"을 감지하기 좋음) — 부상 알림과
  // 완전히 동일한 스냅샷-diff 패턴, 영입/이탈을 합쳐서 한 스냅샷으로 비교.
  useEffect(() => {
    if (!notifyEnabled || !favorites.length) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    (async () => {
      const snapKey = `wc:transferSnapshot:${leagueKey}`;
      let snapshot = {};
      try {
        const r = await window.storage.get(snapKey);
        if (r && r.value) snapshot = JSON.parse(r.value);
      } catch (e) {}
      const nextSnapshot = { ...snapshot };
      for (const team of favorites) {
        const tr = TRANSFERS[team];
        const current = tr ? [
          ...(tr.in||[]).map(x=>`영입:${x.player}(${x.from})`),
          ...(tr.out||[]).map(x=>`이탈:${x.player}(${x.to})`),
        ] : [];
        const prev = snapshot[team] || [];
        const newItems = current.filter(x => !prev.includes(x));
        if (prev.length > 0 && newItems.length > 0) {
          try {
            new Notification(`🔄 ${team} 이적 소식 업데이트`, { body: newItems.slice(0,3).join(" · ") });
          } catch (e) {}
        }
        nextSnapshot[team] = current;
      }
      window.storage.set(snapKey, JSON.stringify(nextSnapshot)).catch(() => {});
    })();
  }, [notifyEnabled, favorites, leagueVersion, leagueKey]);

  useEffect(() => {
    (async () => {
      // 정적 ELO는 파이프라인이 채운다(아래 loadPipelineData). 여기서는 리그 전환 시 초기화만.
      switchLeagueData(leagueKey);
      // 저장된 동적 ELO 델타(있으면)를 불러온다 — 정적 ELO에 합치지 않고 별도 레이어(ELO_DELTA)로 유지.
      // 2026-07-25: 예전에 여기 있던 wc:elo:${leagueKey} 스텁은 아무도 write하지 않는 죽은 코드였고,
      // 설사 값이 있었어도 실행 순서상 바로 아래 loadPipelineData()의 Object.assign(ELO, data.elo)에
      // 덮어써져서 무력화되는 구조였다(정적 ELO에 직접 합치는 방식 자체가 근본 원인) — 그래서 폐기하고
      // 델타 전용 키(wc:eloDelta)로 교체함.
      try {
        const savedDelta = await window.storage.get(`wc:eloDelta:${leagueKey}`);
        if (savedDelta && savedDelta.value) Object.assign(ELO_DELTA, JSON.parse(savedDelta.value));
      } catch (e) {}
      try {
        const savedProcessed = await window.storage.get(`wc:eloDeltaProcessed:${leagueKey}`);
        if (savedProcessed && savedProcessed.value) ELO_DELTA_PROCESSED = new Set(JSON.parse(savedProcessed.value));
      } catch (e) {}
      try {
        const favSaved = await window.storage.get(`wc:favorites:${leagueKey}`);
        setFavorites(favSaved && favSaved.value ? JSON.parse(favSaved.value) : []);
      } catch (e) {
        setFavorites([]);
      }
      // 파이프라인이 아직 없으면 scheduleLoaded/logosLoaded 둘 다 false로 조용히 반환됨 (오류 아님)
      const { scheduleLoaded, logosLoaded } = await loadPipelineData(leagueKey);
      // SCHEDULE이 이제 채워졌으니(있다면), 아직 델타에 반영 안 한 종료경기를 마저 반영.
      try { await applyEloDeltaForNewResults(leagueKey); } catch (e) {}
      setPipelineStatus(scheduleLoaded || logosLoaded);
      setLeagueVersion(v => v + 1);
      setReady(true);
    })();
  }, [leagueKey]);

  const toggleFavorite = useCallback(async (team) => {
    setFavorites(prev => {
      const next = prev.includes(team) ? prev.filter(t => t !== team) : [...prev, team];
      window.storage.set(`wc:favorites:${leagueKey}`, JSON.stringify(next)).catch(() => {});
      return next;
    });
  }, [leagueKey]);

  const onSelectLeague = useCallback((k) => {
    if (k === leagueKey) return;
    setReady(false);
    setLeagueKey(k);
    setTab("predict");
  }, [leagueKey]);

  const forceRefresh = useCallback(() => setLeagueVersion(v => v + 1), []);

  const onSelectMatch = useCallback((h, a) => {
    setPendingMatch({ home: h, away: a, ts: Date.now() }); // ts로 같은 경기 재선택도 감지되게
    setTab("predict");
  }, []);

  return (
    <div style={{maxWidth:520, margin:"0 auto", minHeight:"100vh", paddingBottom:30}}>
      <div style={{padding:"18px 14px 10px", textAlign:"center"}}>
        <div style={{fontSize:19, fontWeight:900, color:T.text}}>⚽ 8개리그 예측기 <span style={{fontSize:13, color:T.cyan, fontWeight:600}}>v0.1</span></div>
      </div>

      <LeaguePicker leagueKey={leagueKey} onChange={onSelectLeague}/>

      {/* 가장 많이 쓰는 예측·일정 — 크게, 별도 줄 */}
      <div style={{display:"flex", gap:8, padding:"6px 12px 10px"}}>
        <button onClick={()=>setTab("predict")}
          style={{flex:1, padding:"13px 10px", borderRadius:14, border:"none", cursor:"pointer",
                  fontSize:15.5, fontWeight:800,
                  background: tab==="predict" ? T.accent : T.surface,
                  color: tab==="predict" ? "#fff" : T.text}}>
          🔮 예측
        </button>
        <button onClick={()=>setTab("schedule")}
          style={{flex:1, padding:"13px 10px", borderRadius:14, border:"none", cursor:"pointer",
                  fontSize:15.5, fontWeight:800,
                  background: tab==="schedule" ? T.accent : T.surface,
                  color: tab==="schedule" ? "#fff" : T.text}}>
          📅 일정
        </button>
      </div>

      {/* 성격별 그룹 카드: 리그 정보 / 팀 정보 / 기록 */}
      <div style={{padding:"0 12px 8px", display:"flex", flexDirection:"column", gap:8}}>
        {NAV_GROUPS.map(g => (
          <div key={g.title} style={{background:T.card, border:`1px solid ${T.border}`, borderRadius:12, padding:"9px 11px"}}>
            <div style={{fontSize:10.5, color:T.dim, fontWeight:700, marginBottom:6}}>{g.title}</div>
            <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
              {g.ids.map(id => {
                const t = TABS.find(x => x.id === id);
                return (
                  <button key={id} onClick={()=>setTab(id)}
                    style={{flex:"0 0 auto", padding:"7px 12px", borderRadius:20, border:"none", cursor:"pointer",
                            fontSize:12.5, fontWeight:700, whiteSpace:"nowrap",
                            background: tab===id ? T.accent : T.surface,
                            color: tab===id ? "#fff" : T.muted}}>
                    {t.label}
                  </button>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      {/* 설정 — 항상 맨 아래, 구분선으로 분리 */}
      <div style={{padding:"4px 12px 10px", borderTop:`1px solid ${T.border}`, marginTop:2}}>
        <button onClick={()=>setTab("settings")}
          style={{width:"100%", padding:"9px", borderRadius:10, cursor:"pointer", marginTop:8,
                  border:`1px solid ${tab==="settings" ? T.accent : T.border}`,
                  fontSize:12.5, fontWeight:700,
                  background: tab==="settings" ? T.accent : "transparent",
                  color: tab==="settings" ? "#fff" : T.muted}}>
          ⚙️ 설정
        </button>
      </div>

      <div style={{padding:"12px 12px 0"}}>
        {!ready ? (
          <Card><div style={{textAlign:"center", color:T.muted, fontSize:13}}>불러오는 중...</div></Card>
        ) : (
          <React.Fragment key={leagueVersion}>
            {tab === "predict" && <PredictTab leagueKey={leagueKey} pendingMatch={pendingMatch}/>}
            {tab === "teams" && <TeamListTab leagueKey={leagueKey} favorites={favorites} onToggleFavorite={toggleFavorite}/>}
            {tab === "ranking" && <RankingTab leagueKey={leagueKey}/>}
            {tab === "schedule" && <ScheduleTab leagueKey={leagueKey} onSelectMatch={onSelectMatch}/>}
            {tab === "squads" && <SquadTab leagueKey={leagueKey}/>}
            {tab === "leaderboard" && <LeaderboardTab leagueKey={leagueKey}/>}
            {tab === "standings" && <StandingsTab leagueKey={leagueKey}/>}
            {tab === "settings" && <SettingsTab leagueKey={leagueKey} favorites={favorites} onToggleFavorite={toggleFavorite} onDataReset={forceRefresh} notifyEnabled={notifyEnabled} onToggleNotify={toggleNotify} themeMode={themeMode} onChangeTheme={changeTheme}/>}
            {tab === "outlook" && <SeasonOutlookTab leagueKey={leagueKey}/>}
            {tab === "history" && <HistoryTab leagueKey={leagueKey}/>}
          </React.Fragment>
        )}
      </div>

      <div style={{textAlign:"center", marginTop:24, fontSize:10, color:T.dim, padding:"0 20px"}}>
        {pipelineStatus === null ? (
          <span>⏳ 파이프라인 연결 확인 중...</span>
        ) : pipelineStatus ? (
          <span style={{color:T.green}}>✅ 파이프라인 연결됨 — 이 리그는 실데이터 적용됨</span>
        ) : (
          <span>⚠️ 파이프라인 미연결 — 아직 스켈레톤(ELO 1500 기본값)입니다</span>
        )}
        <br/>다음 단계: 로고 매핑 → 예측 엔진 고도화
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { hasError:false, err:null }; }
  static getDerivedStateFromError(err){ return { hasError:true, err }; }
  render(){
    if (this.state.hasError) {
      return <div style={{padding:20,color:"#ff6b6b",fontFamily:"monospace",fontSize:13,lineHeight:1.7,whiteSpace:"pre-wrap"}}>
        ⚠️ 렌더링 오류\n\n{String(this.state.err && this.state.err.message || this.state.err)}
      </div>;
    }
    return this.props.children;
  }
}

try {
  document.getElementById("root").dataset.mounted = "1";
  ReactDOM.createRoot(document.getElementById("root")).render(
    <ErrorBoundary><App/></ErrorBoundary>
  );
} catch (e) {
  const el = document.getElementById("root");
  if (el) el.innerHTML = '<div style="padding:20px;color:#ff6b6b;font-family:sans-serif;font-size:14px;line-height:1.6">'
    + '⚠️ 앱 로딩 중 오류가 발생했습니다.<br/><br/>'
    + '<small style="color:#888">' + (e && e.message ? e.message : e) + '</small></div>';
}
</script>

<script>
if ("serviceWorker" in navigator && (location.protocol === "http:" || location.protocol === "https:")) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>

</body>
</html>
